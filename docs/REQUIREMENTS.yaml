  - id: REQ-043
    description: Discover candidate bell-schedule pages across a district web ecosystem (district site plus individual school subdomains) from an NCES CCD URL
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Discovery is search-led (site search, sitemap.xml, a search API, or LLM-guided link selection), NOT blind whole-site crawling
      - Enumerates individual school sites/subdomains, since 80%+ of districts publish schedules only at the school level
      - Selects a sample of schools scaled to district size and grade span (small districts near-census; large districts a subset spanning elementary/middle/high)
      - Emits ranked candidate page URLs together with the signal that selected each
      - Tolerates HTTP-to-HTTPS certificate mismatches (ignoreHTTPSErrors) and browser-launch errors without aborting the district
      - Honors the ONE-attempt rule on Cloudflare/WAF/Akamai blocks (Rule 3) and records blocked districts in enrichment_attempts
      - Bounded by per-district effort caps (REQ-051) and degrades to statutory fallback when nothing is found (REQ-049)
    created: "2026-06-13T00:00:00Z"
    updated: "2026-06-13T00:00:00Z"
    notes: "Replaces the abandoned Crawlee URL-glob crawl. Probe 2026-06-13 found glob targeting
      matched zero links on 4/4 districts and broad crawl was slow, noisy, and missed every known schedule;
      federated school-subdomain structure (e.g. Sweetwater, KIPP) multiplies any crawl ~15x.
      IMPLEMENTED_BY (status bumped accepted→tested 2026-06-26): Stage 2, REQ-058 (cost-ascending waves)
      + REQ-068/069/070/071/072 (tested); ran live on all 12 batch_00001 districts (12/12 found_all).
      Design umbrella; the as-built stage REQs carry the tests. NOTE: Wave-1 execution is moving to
      headless `claude -p` (REQ-104) — see PIPELINE_GOVERNANCE_AND_STATE_2026-06.md."

