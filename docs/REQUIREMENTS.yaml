    notes: "Design/present-state: STAGE7_EXTRACT_DESIGN.md §0 (rewritten present-state-first). Council extraction, GT scoring, durability/resume, the request-more-evidence detect/persist/review engine, and the gate@7 console are all built and validated against real batch_00000 data. Reuses stage6_handoff.requests/prompts (assembly) + stage8_aggregate.aggregate (consensus/mode). The two family maps (aggregate.py short-name vs councils.py full-id) were unified into common.model_families keyed on full OpenRouter ids (single source of truth; grimp-verified importers). Remaining work (request-loop execution; Council Lab items) tracked on GitHub: #80 (Council Lab), #81 (spray A/B), #82 (image-council judge not vision-capable)."

  - id: REQ-118
    description: "Stage 7 request-more-evidence EXECUTION: an approved gate@7 ExtractionRequest fires the target stage's back-edge. Two mechanisms — (a) 7->6 DIRECT re-dispatch of an already-captured alternate representation (no new capture, bypasses Stage 1); (b) 7->2/7->3/7->1 wrapped in a Stage-1 FOLLOW-UP BATCH (any NEW capture/discovery routes through Stage 1 and stays reviewable at gate@1 — governance §11d), collected into one batch honoring the 12-district cap. Guarded by the REQ-051 budget governor + a per-district×band request-depth guard so the cyclic loop provably terminates."
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - "Approving a request at gate@7 stays PURE review (status->approved); a SEPARATE compose step materializes work — gate@7 is not coupled to batch/dispatch creation"
      - "compose_followup_batch sweeps APPROVED 7->2/7->3/7->1 requests into ONE draft Stage-1 batch (batch_type='follow-up') targeting the union of districts + unsatisfied bands (+ school/URL seeds), 12-district hard cap with spillover, flips those requests to 'executed', and links batch<->request for lineage; the batch is a DRAFT reviewable at gate@1 (never auto-approved)"
      - "A follow-up batch is TARGETED (explicit districts/bands), not stratified — Stage 1 grows a targeted-batch builder distinct from build_batch's cold-start draw"
      - "7->6 execution builds a NEW immutable dispatch from the NAMED alternate reps (params.alternate_reps) with the routed council, re-entering Stage 7 via the normal extract path; the prior dispatch is untouched (history preserved); the request flips to 'executed'"
      - "The paid 7->6 re-extraction is gated by the REQ-051 budget governor (per-district + per-run caps) BEFORE any OpenRouter call"
      - "The request-depth guard (budget max_request_rounds) blocks a district×band that has already fired the max re-request rounds, derived from executed ExtractionRequest history — the loop terminates"
      - "Execution is idempotent: re-running compose/execute does not duplicate batches/dispatches or re-fire an already-executed request"
      - "Server endpoints (compose-followup + execute/{request_id}) expose both mechanisms; CLI-first, console buttons follow"
    tests:
      - tests/test_stage7_execute.py
      - tests/test_stage7_api.py::test_compose_followup_endpoint
      - tests/test_stage7_api.py::test_execute_endpoint_success
      - tests/test_stage7_api.py::test_execute_endpoint_refused_is_409
    created: "2026-07-03T00:00:00Z"
    updated: "2026-07-03T00:00:00Z"
    notes: "Closes the request-more-evidence loop left open by REQ-117 (its last acceptance criterion) and STAGE7 §3F. Depends on REQ-051 (budget governor, built first). Design decisions (Ian, 2026-07-03): build BOTH mechanisms + all four routes; collect approved NEW-work requests into ONE follow-up batch; keep gate@7 approve as pure review with a separate compose step; build REQ-051 first as a hard prerequisite. The 'wrap NEW capture/discovery in a Stage-1 batch' rule (Ian) resolves the §3F-vs-§11d tension: only 7->6 (existing reps) is a true direct back-edge; 7->2/7->3/7->1 all converge on a Stage-1 follow-up batch. Authority: STAGE7_EXTRACT_DESIGN.md §3F, PIPELINE_GOVERNANCE_AND_STATE.md §11b/§11d/§11e."

  - id: REQ-119
    description: External AI service (LLM) calls MUST stream results (SSE), never a single blocking read — a provider-agnostic contract
    type: constraint
    priority: must
    status: tested
    acceptance_criteria:
      - "The live generative client (stage7_extract/openrouter.py) issues stream:true, accumulates deltas incrementally, and reads usage/finish_reason/generation_id off the stream (not a blocking response) — MET"
      - "Streaming is NOT caller-controllable to False: no argument combination turns it off (the flag is fixed True in the request body) — MET"
      - "Streaming survives long idle gaps: keep-alive/empty chunks are tolerated without content loss; a long multi-school generation reassembles in order across many chunks (not one un-chunked read) — MET"
      - "Truncation (finish_reason == 'length') and mid-stream errors are surfaced with partial content preserved (the silent-tail-loss tripwire) — MET"
      - "A provider-agnostic SOURCE GUARD flags any OpenAI-SDK chat-completion call in the acquisition code that is not streaming; a NEW blocking call anywhere fails the test — MET"
      - "Deprecated, non-live call sites are an explicit, bounded allowlist (not a silent pass) — MET; the allowlist emptied 2026-07-06 when its only entry (openrouter_search) was removed, #87 — any non-streaming call now fails outright"
      - "Any alternative provider adapter swapped in later must present the same streaming call() contract — enforced by the behavioral + source guards"
    tests:
      - tests/test_streaming_contract.py
      - tests/test_stage7_openrouter.py::test_stream_accumulates_deltas_and_reads_final_usage
      - tests/test_stage7_openrouter.py::test_mid_stream_error_keeps_partial_content
    created: "2026-07-04T00:00:00Z"
    updated: "2026-07-04T00:00:00Z"
    notes: "Rationale (Ian, 2026-07-04): a non-streaming completion on a long generation (a big hub district returns a long single-shot JSON) idle-times-out the connection — a silent, load-bearing failure mode during automatic processing AT SCALE. Streaming keep-alive chunks hold the socket open, deltas arrive incrementally, and a mid-stream failure yields a partial + structured error instead of a dropped connection. The ONLY live generative call site is the council extraction client (already streams, REQ-117); the SERP providers (serper/brightdata) are search/data APIs (not token-generating, streaming N/A). The formerly-deprecated non-streaming site (common/discover.py openrouter_search, the retired ~$27/1K OpenRouter AI-search Wave provider, issue #41; sibling perplexity_search) was REMOVED 2026-07-06 (#87) along with its error-handling tests; the source-guard allowlist is now empty."

