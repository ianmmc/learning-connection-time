last_updated: "2026-07-16T00:00:00Z"

# STATUS VOCABULARY — normalized 2026-07-16 (Ian). These SIX values are the whole set; do not invent
# more (the pre-normalization file carried ad-hoc `in-progress` / `not_started` / `draft` one-offs, and
# `in-progress` was exactly where two stale statuses hid).
#   proposed   — written down, not yet agreed
#   accepted   — agreed, not yet built (or built in part: use notes to say which part)
#   implemented— built, tests not yet written/passing  (transitional; prefer moving straight to tested)
#   tested     — built AND its cited tests pass. A `tested` claim should be CITEABLE: fill `tests:`.
#   superseded — replaced by another REQ. MUST carry `superseded_by: [REQ-xxx]` — a forwarding address.
#   retired    — the need went away; NO successor exists. MUST carry `retired_reason:`.
#                (Distinct from superseded on purpose: superseded means "go read that one instead",
#                 retired means "this whole idea is gone" — e.g. the Crawlee/Ollama scraper-service era.)
# Cross-refs: use the `github_issue:` KEY, not prose in `notes:` — a mechanical sweep can only see the key.

requirements:
  - id: REQ-001
    description: Calculate LCT using formula (Daily Instructional Minutes × Staff) / Enrollment
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Returns raw (unrounded) float minutes per student per day; rounding happens at export
      - Returns None when enrollment <= 0 (no division error)
      - Returns None when staff_count <= 0 (LCT undefined with no instructional staff)
      - Accepts instructional_minutes, staff_count (float FTE), enrollment as inputs
      - Result is mathematically correct per formula
    tests:
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_basic_calculation
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_returns_float
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_unrounded_precise_value
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_zero_enrollment_returns_none
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_zero_staff_returns_none
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_handles_float_staff
      - tests/test_lct_calculation.py::TestLCTCalculation::test_lct_result_in_reasonable_range
      - tests/test_lct_calculation.py::TestLCTEdgeCases::test_edge_cases
    created: "2025-01-10T22:00:00Z"
    updated: "2026-06-06T00:00:00Z"
    notes: "Tests exercise the REAL production calculate_lct (was a placeholder reimplementation until 2026-06-06)."

  - id: REQ-002
    description: Import and normalize NCES CCD district data
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Fetches data from NCES API or local files
      - Normalizes district names
      - Captures full NCES IDs with leading zeros
      - Stores in PostgreSQL database
      - Handles missing/null values appropriately
      - "A source-year import that matches fewer than 95% of min(file districts, our districts) after
        LEAID normalization ABORTS (SystemExit) rather than silently committing a partial import"
    tests:
      - tests/test_nces_import.py::TestNCESDataFetch::test_fetches_data_from_nces_api
      - tests/test_nces_import.py::TestNCESDataFetch::test_fetches_data_from_local_files
      - tests/test_nces_import.py::TestDistrictNormalization::test_normalizes_district_name_uppercase
      - tests/test_nces_import.py::TestDistrictNormalization::test_normalizes_leaid_format
      - tests/test_nces_import.py::TestDatabaseStorage::test_stores_district_in_database
      - tests/test_nces_import.py::TestDatabaseStorage::test_stores_enrollment_data
      - tests/test_nces_import.py::TestDatabaseStorage::test_stores_staff_data
      - tests/test_nces_import.py::TestNullValueHandling::test_handles_null_enrollment
      - tests/test_nces_import.py::TestNullValueHandling::test_handles_null_staff_counts
      - tests/test_nces_import.py::TestNullValueHandling::test_converts_empty_strings_to_null
      - tests/test_nces_leaid_normalization.py
    created: "2025-01-10T22:00:00Z"
    updated: "2026-07-22T00:00:00Z"
    notes: "**Incident (issue #611/#612, 2026-07-22):** `import_staff_and_enrollment.py` normalized
      LEAIDs with `str(int(x))`, which STRIPS the leading zero this REQ's own acceptance criterion
      requires ('0100810' -> '100810'). Migration 015 (2026-01-24) had LPAD-standardized the `districts`
      table to 7-digit leading-zero ids, so every import run after 015 — including the 2024-25 one —
      produced stripped ids that failed the `.isin(existing_districts)` match and were silently dropped.
      Impact: every FIPS<10 state (AL/AK/AZ/AR/CA/CO/CT) was undercounted — 3,053 of 3,125 missing
      districts (97.7%), CA alone 1,985; coverage 17,842->14,717 (79%) for enrollment_by_grade. Found
      incorporating Coffee County (0100810) in the Stage 9 campaign (REQ-162's notes). The pre-existing
      `test_normalizes_leaid_format` never caught this: it tests a test-LOCAL reimplementation
      (`self._normalize_leaid`), never the real importer — REQ-002 had claimed 'tested' status against
      this exact acceptance criterion while the production code silently violated it. Fixed: both
      normalization sites (staff + enrollment) now share `_canonical_leaid()` (zfill(7), never
      `str(int())`); a new `_assert_match_coverage()` aborts the import if post-normalization match rate
      falls below 95% of `min(file, table)` districts (the new acceptance criterion above); re-ingested
      2024-25 (enrollment 14,717->17,751, staff 14,720->17,754, zero duplicates, 2023-24 untouched; 91
      remaining are genuinely absent from the raw file — closed/merged districts). `test_nces_leaid_normalization.py`
      (11 tests) pins the real importer function directly — leading zeros preserved, every FIPS<10 sample
      round-trips, the 82.5% partial-import case must raise. `test_normalizes_leaid_format` itself was
      also fixed to call the real function (was the self-testing-theater pattern REQ-003's notes already
      flagged elsewhere in this file)."

