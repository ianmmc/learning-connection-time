    priority: must
    status: accepted
    acceptance_criteria:
      - "Gates are manual/auto with confidence-escalation; a gate eases to auto only when its reliability is demonstrated on real output (ramp-up model, governance §11b)"
      - "An automatic action is admitted when its failure mode is observable AND reversible AND spend-conservative — risk asymmetry decides, not 'a human must touch it' (MEMORY project-auto-act-when-observable)"
      - "Auditable receipts (REQ-165/REQ-164) make failure observable — the precondition for safely easing a gate to auto"
      - "The residual — is a new human touchpoint justified? could a proven gate ease to auto now? — is a periodic-sweep review, the clearest sweep candidate (least deterministically testable)"
    enforced_by: [REQ-164, REQ-165]
    verification: periodic-sweep
    created: "2026-07-22T00:00:00Z"
    updated: "2026-07-22T00:00:00Z"
    notes: "Ian's commandment #4. The least deterministically-testable commandment (mostly qualitative) —
      encoded so the periodic sweep has an explicit charter. Its one hard dependency is observability
      (REQ-164/165): you cannot safely automate what you cannot audit."

  - id: REQ-169
    github_issue: "epic #617 (#618-#625)"
    description: "THE TYPE AXIS — handling instructions for batches and dispatches. Batches (Stages 1-4)
      carry batch_type first-run|follow-up|benchmark; dispatches (Stages 6-7) carry dispatch_type
      production|benchmark. Each benchmark harness has a TERMINUS (benchmark batch -> gate@5; benchmark
      dispatch -> gate@7), which is what makes benchmark output structurally incapable of reaching the
      LCT write. Every benchmark rule is scoped to the PROVENANCE OF THE WORK — a representation, or the
      (handoff x district) that produced a fact — and NEVER to the district's identity or membership
      history."
    type: architectural
    priority: must
    status: in_progress
    acceptance_criteria:
      - "GRAIN: no guard deciding LCT-write eligibility keys on 'has this district ever been in a batch_type=benchmark batch'. batch_district rows are never deleted, so that question is permanently yes and permanently refuses correct, freshly-sourced minutes (the defect epic #617 exists to retire)"
      - "MOBILITY (the acceptance test, Ian 2026-07-25): a district moves between harnesses in BOTH directions — (1) benchmark batch -> follow-up batch, (2) first-run/follow-up batch -> benchmark batch, (3) benchmark dispatch -> production dispatch, (4) production dispatch -> benchmark dispatch. One named regression test per direction"
      - "ONE definition per rule: batch types + the redo lever in common/batch_types.py; benchmark predicates (district-membership grain AND representation grain) + dispatch types in common/benchmark.py. common is the base layer every stage may import — which is what makes a single home possible, since stage9_incorporate cannot import process_governance and that layering forced five hand-maintained copies"
      - "batch_type and dispatch_type are VALIDATED (batch_store.create_batch / validate_dispatch_type), never unconstrained strings whose legal values live in a comment"
      - "REFUSE, DO NOT COERCE, when a guard's unit is coarser than its trigger: a dispatch carries ONE type, so a production dispatch that selected any benchmark-provenance representation is REFUSED at freeze, naming the representations — auto-forcing the whole dispatch to benchmark would wall every OTHER district sharing it"
      - "dispatch_type rides handoff._identity (the verified_only precedent), so the same reps dispatched benchmark vs production are hash-distinct artifacts and a preview-as-production / freeze-as-benchmark flip 409s instead of silently substituting"
      - "The frozen handoff RECORDS its own dispatch_type: 'was this dispatch benchmark?' is answerable from the receipt alone, never only from a DB row that could be lost or disagree"
      - "REDO-ELIGIBILITY IS DECLARED (batch.redo_attempted), not derived from batch_type. An absent value falls back to the historical batch_type=='follow-up' rule so no pre-existing batch changes behavior. Deriving it would let one Stage-2 run on batch_00000 merge fresh SERP candidates into the 27 curated districts' FROZEN gt:// candidate sets (REQ-059's corpus is fixed)"
      - "The Stage-9 write guard has TWO arms, neither redundant: the stamped handoff.dispatch_type (which cannot see a production dispatch that pulled in a stale benchmark representation) and provenance DERIVED from the representations behind the facts (which cannot see a Council Lab A/B composed entirely of production representations) — MET 2026-07-26 (#619). GRAIN CORRECTION: the derived arm reads the FROZEN APPROVED RECEIPT's write-bearing schools (bands[*].schools[*].rec_key / fact_id), which is FACT grain, not the (handoff x district) grain earlier specified — school_fact.rec_key exists and is 100% populated (2782/2782), so fact->representation IS traversable. Reading the receipt also avoids a fail-OPEN hole: _load_handoff_by_hash returns None for a pruned handoff file, which would have answered not-benchmark for exactly the districts whose receipts went missing"
      - "The write guard refuses on ANY benchmark-provenance evidence rather than dropping the tainted fact (one injected representation taints the band value it feeds, and dropping it would silently change an approved number). The auditable way to satisfy it is a human striking the stale evidence at gate@8 (band_exclusion, REQ-257): an excluded school is applied BEFORE the mode, so it is not a source of the band's value and does not refuse the write on its behalf. A school carrying NEITHER identifier is a human-added fact — no capture, so no provenance to check, and it must not be read as 'unknown' and refused"
      - "The gate@8 REVIEW QUEUE is provenance-scoped by the same definition (IS_BENCHMARK_PROVENANCE_SQL), and must land WITH the Stage-9 wall rather than after it: gate@8 is the only door to a Stage-9 write, so re-keying the write alone leaves the fix unreachable and the mobility property vacuous — MET 2026-07-26"
      - "The mode-stability early-exit's full-census exemption (REQ-151) is a property of THE RUN, read off the frozen handoff (run_kind, gt_data, dispatch_type), never of a district's batch membership — membership would make all 27 re-run districts pay a full-census extraction on every future production run, forever — MET 2026-07-26 (#619), inverting two pre-#619 pins"
      - "An operator can COMPOSE a targeted batch (follow-up or benchmark) over a named district list, via API and console — build_batch's eligible_pool drops every district at furthest_stage>=3, so without this neither mobility property 1 nor 2 is expressible at all"
      - "NOT YET MET — the benchmark-BATCH terminus is unenforced for newly-composed benchmark batches (REQ-170 / #640)"
      - "The #134 request-execution guards (stage7_execute _gather / _bundle_alternate / _dispatch_recover_band) key on DIRECTIVE PROVENANCE, not district membership — MET 2026-07-26 (commit 4563efe), after its blocking prerequisite #644 closed the two unguarded freeze paths that the membership wall had been accidentally load-bearing for. #134's own rationale was obsolete in its premises: it guarded against evading 'the Stage-9 walls that key off batch_type', which is the wall this requirement retired"
      - "EVERY path that freezes a dispatch must pass assert_dispatch_type_allowed — MET 2026-07-26 (#644). The guard had ONE call site (stage6_dispatch) against THREE freeze paths: stage7_execute's two gate@7 back-edges called HND.freeze directly and defaulted dispatch_type to production, so they could mint a production dispatch holding injected gt:// representations. Latent only because the #134 membership wall kept benchmark districts away from both, which made a district-identity ACCIDENT load-bearing for a provenance rule. Enforced by a per-function AST fitness test over every HND.freeze call site (the defect was a MISSING call site, so counting the guarded OPERATION is the only durable fix — testing the guard again could never have found it); the back-edges reach it through a declared adapter that returns their {ok: False, reason} contract instead of raising"
      - "SCOPE, not only GRAIN: every layer between a re-run and the LCT write must ask about THIS RUN's work, not about everything the district has ever produced. NOT MET (#662) — the grain moved (district -> provenance) at all three layers, but only Stage 9's wall is receipt-scoped. The gate@8 queue predicate asks 'has this DISTRICT ever produced a benchmark-provenance fact' over append-only tables, which is permanently yes (measured: 25 of 25 #620 districts walled today), and merge_fact_runs pools every production fact with earliest-run-wins, so the historical benchmark facts outrank fresh ones (measured: 957 of 957 accepted benchmark facts carry school_year=NULL, so the #254 year-supersede rule never engages). Pinned end-to-end by tests/test_benchmark_rerun_acceptance.py — the two front layers are strict xfails, so the fix cannot land quietly. This gates the #620 campaign, which is the ONLY validation of REQ-169's mobility property: every prior measurement was taken in the one state where the three layers necessarily agree"
      - "The frozen handoff's per-record payload (rec_key/url/reps/decision) must be readable from gov_db, not only from the disk artifact. NOT MET (#645): the handoff table stores metadata + a path, so closing_argument._evidence_from_handoffs globs and reads the JSON to build the evidence that gets frozen into the gate@8 receipt — active processing over a receipt, and it degrades silently when a file is pruned (_load_handoff_by_hash returns None). This is why the REQ-169 write guard reads the receipt + gov_db and never the artifact"
    tests:
      - tests/test_batch_mobility.py
      - tests/test_stage6_dispatch_type.py
      - tests/test_benchmark_predicate.py
      - tests/test_benchmark_rerun_acceptance.py
      - tests/test_stage7_mode_stability.py
      - tests/test_stage9_incorporate_integration.py
      - tests/test_stage9_mapping.py
    depends_on: [REQ-117, REQ-151, REQ-162, REQ-059]
    verification: mixed
    created: "2026-07-25T00:00:00Z"
    updated: "2026-07-26T00:00:00Z"
    notes: "Origin: the 27 batch_00000 ground-truth districts could never be written to lct_db, because a
      guard mirrored across five sites keyed on district IDENTITY where the documented rationale was about
      extraction PROVENANCE. Identity was a proxy that held only while a district had exactly one history.
      Ian's framing (2026-07-25): batches and dispatches began as HUMAN-FACTORS constructs (working in sets
      makes supervision attention and approval clicks affordable during the ramp-up); the type axis is a
      distinct third layer that makes it possible to test, measure and train WITHOUT experimental output
      reaching lct_db. The dispatch axis is deliberately TWO-valued while the batch axis is three: a
      dispatch has no first-run/follow-up notion (that is derivable from a district's dispatch history),
      and a third value carrying no behavior invites exactly the string-equality coupling this retired.
      Full evidence + the record of what the planning pass got wrong:
      docs/technical-notes/learning-loop-reports/2026-07-25-epic617-benchmark-model-findings.md;
      durable architecture: PIPELINE_GOVERNANCE_AND_STATE.md §13. status in_progress — Phases 1/2a/2b/2c
      landed; #619 (guard re-scoping), #620 (the 27-district re-run) and #640 open."

  - id: REQ-170
    github_issue: "#640 (epic #617)"
    description: "Durable REPRESENTATION-GRAIN batch provenance: every capture records the batch(es) that
      produced it, ON THE RECEIPT (captures.json), so 'was this representation produced by a benchmark
      batch' is answerable without inferring it from the district. This is what makes the benchmark-BATCH
      terminus (gate@5) enforceable."
    type: functional
    priority: should
    status: proposed
    acceptance_criteria:
      - "The stamp lives on the RECEIPT, not only in the DB: cache_ingest.upsert_capture_rows does DELETE-then-UPSERT from captures.json and the cross-stage cache is regenerable from disk, so a DB-only column is erased by the next re-ingest"
      - "Node stamps the producing batch per capture record (captures.json is written by Node; capture_stage3.reconstruct, the recovery path, must stamp too). seedFromPriorCaptures already carries prior records VERBATIM into a new manifest, so a seeded prior-round record keeps its ORIGINAL batch for free — which is exactly what the set semantics needs"
      - "Provenance is a SET, not a column: capture is keyed (district_id, hash) and the hash derives from the URL, so one representation genuinely can be produced by both a benchmark and a production batch. Modeled as a link table"
      - "WALL RULE (Ian, 2026-07-25): a representation is walled from production dispatches iff it has producers AND EVERY producer is a benchmark batch. benchmark-only -> walled; benchmark + first-run/follow-up -> allowed (a production batch independently found it); no producers recorded -> allowed (every pre-stamp row; today's behavior, unchanged)"
      - "Rejected alternatives, recorded: 'any benchmark producer walls it' penalizes a production batch because an experiment happened to find the same page — the REQ-169 district-identity pattern one grain down; 'first producer wins' makes the answer depend on run order, an accident rather than a fact about the representation"
      - "Node/Python parity vectors for the stamp, in the existing #34/#416 CMS-host-parity style"
    depends_on: [REQ-169, REQ-164]
    verification: test
    created: "2026-07-25T00:00:00Z"
    updated: "2026-07-25T00:00:00Z"
    notes: "The gap REQ-169 does not yet close. Today's representation-grain guard keys on
      capture.source='benchmark_gt', which ONLY the one-shot batch_00000 injector writes; a benchmark batch
      composed through the Phase-2c targeted composer captures real URLs, which Node records as
      discovered/emergent — indistinguishable from first-run output. Measured live 2026-07-25: discovered
      1450 / emergent 206 / benchmark_gt 95 / manual 1. Sequenced into #623, which already opens the Node
      capture_discovery.mjs seam (avoids touching Node twice)."

  - id: REQ-171
    github_issue: "#622, #623, #645 (the open violations); generalizes REQ-164 beyond the capture dir"
    description: "PIPELINE-WIDE INVARIANT — RECEIPTS ARE EVIDENCE, gov_db IS THE TRANSPORT. Every artifact
      the acquisition pipeline writes to disk is an auditable RECEIPT of work done. No active-pipeline
      operation may read any such artifact as its input, and no artifact's EXISTENCE, name, or absence may
      serve as pipeline state. The governance DB is the sole working store between stages; disk holds
      binaries plus receipts (governance §1). This is the location-independent generalization of REQ-164,
      whose otherwise-identical rule is scoped to per-district capture-dir receipts and therefore does not
      reach the data/acquisition/ artifacts or the fixed-filename stage-done markers."
    type: architectural
    priority: must
    status: proposed
    acceptance_criteria:
      - "SCOPE IS EVERY PIPELINE-WRITTEN ARTIFACT, not a directory. Three classes exist today and REQ-164 names only the first: (a) per-district capture-dir receipts under data/raw/lea-website-captures/<dir>/ — covered, MET; (b) cross-district artifacts under data/acquisition/ (handoffs/, batches, remediation) — NOT covered; (c) the fixed-filename stage 2-4 handoffs (discovery.json/candidates.json/captures.json/processed.json) whose EXISTENCE is a stage-done marker — NOT covered, and the clearest violation of the rule's second half"
      - "NO ARTIFACT IS PIPELINE STATE. A stage's completion is a gov_db state_event, never the presence of a file. Reading a done-marker is the same defect as reading a receipt as input — it is transmission by filesystem, one bit wide. Tracked as #622/#623"
      - "NO ACTIVE READ. Known open violation: stage8_aggregate/closing_argument._evidence_from_handoffs globs and reads data/acquisition/handoffs/*.json to build the evidence that is then FROZEN into the gate@8 receipt authorizing a production write. The per-record payload has no gov_db home at all (the handoff table stores metadata + a path). Tracked as #645"
      - "SILENT DEGRADATION IS THE TELL. An active read of a receipt cannot distinguish 'absent' from 'no such fact' — _load_handoff_by_hash returns None for a pruned file and the closing argument quietly loses evidence. A gov_db read fails loud instead. This is also why the REQ-169 benchmark wall reads gov_db and not the artifact: the artifact path would have FAILED OPEN for exactly the districts whose receipts went missing"
      - "FROZEN ARTIFACTS ARE NOT AN EXCEPTION, THEY ARE A DUAL-WRITE. An immutable artifact (a frozen handoff, a gate@8 approval receipt) IS the authoritative record for audit — REQ-169 requires a dispatch's type be answerable 'from the receipt alone, never only from a DB row that could be lost or disagree'. The resolution is not to read the file during operations but to hold the SAME content in gov_db, derived from the artifact and verifiable against it, so divergence is detectable. Reconciles this REQ with feedback-derive-provenance-from-receipts: DERIVE from the receipt, then READ the derivation"
      - "WRITE ORDER, unchanged from REQ-164: the gov_db commit precedes the receipt write, so a crash may leave a receipt LAGGING (re-derivable) but never AHEAD of the authoritative store"
      - "ENFORCED, NOT ASSERTED. A fitness test over infrastructure/acquisition/ flags a disk read (open/glob/Path.read_text) of any pipeline-written artifact from a non-recovery, non-audit code path, with recovery/backfill/maintenance entry points declared in arch-manifest.json rather than pattern-matched. The rule has been true in prose across at least six stage-level REQs (101, 110, 128, 154, 163, 164) and was still violated in a seventh place — prose does not hold a cross-cutting invariant"
      - "NOT IN COMPLIANCE AT PROPOSAL TIME. #622 + #623 (done-marker inversion) and #645 (handoff payload) must land before this can move past proposed; #616 closed the last capture-dir round-trip. Recording it now so the rule exists as a rule rather than as seven stage-level restatements"
    depends_on: [REQ-164, REQ-165, REQ-110]
    verification: test
    created: "2026-07-26T00:00:00Z"
    updated: "2026-07-26T00:00:00Z"
    notes: "Proposed 2026-07-26 (Ian) after #645 surfaced a live active-read of a frozen handoff artifact.
      Ian's framing: the pipeline must 'both produce auditable receipts at each stage and not utilize those
      receipts for data transmission during active operations'. The audit that prompted it: the production
      half IS generalized (REQ-164), but the transmission half is stated only per-stage — REQ-101
      ('filtered.json is the auditable receipt, not the transport'), REQ-154 ('the JSON receipts are never
      the downstream transport'), REQ-110/163 ('DB is the working store'), REQ-128 (origin derived from
      receipts) — each true, none binding on a stage that had not yet been written. REQ-164 comes closest
      and is marked tested, which is accurate for its stated scope and is exactly why the gap was invisible:
      its rule is scoped to the capture dir, and #645's violation is in data/acquisition/."
