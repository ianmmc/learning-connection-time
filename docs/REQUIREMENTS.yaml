    description: "Stage 3 outcome rollup and registry write-back - OAuth/Drive failures are a per-item flag, not a batch halt, distinct from the Stage 2 billing CONTROL FAILURE"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - The district-level outcome is a rollup of every candidate's ok/err: captured_all (every candidate succeeded), capture_failed_all (none did), or captured_partial (mixed) - full per-candidate detail lives only in captures.json, never duplicated into the registry
      - A failed candidate's specific reason (e.g. needs_oauth_reauth) is summarized in the registry's notes field, but the registry NEVER maintains a live array of open issues - a human generates the actual triage list on demand by scanning captures.json files for a specific err value when ready to act, avoiding the sync-bug risk of an accumulating structure that has to stay in sync with reality
      - An OAuth/Drive-API failure on one candidate does NOT halt the run (unlike the Stage 2 billing CONTROL FAILURE, where one failure means every subsequent call fails identically) - one stuck Drive item says nothing about the rest of the batch, so capture moves on to the next candidate
      - The registry is written exactly once per district, at actual completion (captures.json already on disk) - same single-write-orchestrator-only principle as Stage 2 (REQ-072), no schema changes to district_status.py needed
    tests:
