  - id: REQ-097
    github_issue: "#75 — Stage-5 drift detector (reopened) (doc-migration 2026-07)"
    description: Stage 5 drift detector — alert when newly-labeled data degrades the live config enough to warrant a retune
    type: functional
    priority: should
    status: accepted
    acceptance_criteria:
      - Bernoulli CUSUM on tier-A recall and precision separately vs the policy floor (accumulates evidence; a single noisy batch won't trip it)
      - Two-gate against small-n false alarms — alert only when CUSUM trips AND the lower Wilson-score CI bound also breaches the floor
      - Distinguishes config-induced data change (a tuning move's own effect) from new-district data change (the world shifted -> retune)
      - Surfaces "retune recommended" in the governance console; never auto-retunes (CP ramp-up posture)
