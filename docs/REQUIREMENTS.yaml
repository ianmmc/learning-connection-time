    notes: "Designed 2026-06-23, schema revised same day once the waterfall (one winning representation) was
      replaced by 'run every kept tool, always' (a list of representations). The reference-only-vs-inline-text
      question was explicitly raised and confirmed by the user mid-design. Built and run live against all 12
      real batch_00001 districts the same day: 10 processed_all, 2 processed_partial, 150/150 records
