  - id: REQ-083
    description: "Stage 4 PDF/OCR tool roster - RESOLVED by an empirical spike against all 150 real captured PDFs in batch_00001, not decided from research alone"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - "Spike installed and ran 8 fast/deterministic candidates (pdftotext, pdfplumber lines+text strategies, PyMuPDF, camelot stream/network/hybrid/lattice, img2table bordered+borderless) plus tesseract against every PDF (150 total across 12 districts) via data/benchmark_results/stage4_pdf_tool_spike/run_spike.py, recording cheap comparison metrics (char count, plausible-time count, table count, printable ratio, elapsed seconds, error) per (PDF, tool) to summary.jsonl"
      - "KEPT (real evidence, not just literature): pdftotext (58.7% hit rate), pdfplumber lines-strategy only (42.7% hit rate, but added genuinely NEW signal beyond the existing .txt baseline on 30/150 PDFs - more than any other tool), camelot stream (51.3% hit rate) and hybrid (42.0% hit rate but highest average richness at 11.4 times/hit), tesseract (60.0% hit rate, the single highest of any tool, beat baseline on 15/150)"
      - "DROPPED (real evidence): PyMuPDF/fitz (14.7% hit rate, confirmed low marginal value over pdfplumber - a PyMuPDF maintainer's own GitHub comment confirms the two tools 'have the same root'); pdfplumber text-strategy (33.3% hit rate despite extracting MORE raw characters than lines-strategy - confirmed garbling on Longfellow's page.pdf: word-chopped fragments, a Private-Use-Area icon-webfont glyph bleeding into output); camelot network (24.0%) and lattice (20.7%) flavors (stream/hybrid cover the same ground better); img2table bordered (2.0% hit rate - found a time in ZERO of the 140 page.pdf/Chromium-rendered captures, exactly confirming the predicted weakness that CSS border strokes do not survive OpenCV rasterization) and borderless (23.3%, mediocre, and the most complex to wire - needs an OCR backend internally for no payoff over camelot/pdftotext)"
      - "Spot-checked the two biggest raw-metric 'wins' by hand before trusting them: Stroudsburg's camelot_hybrid win (88->206 times) was real, a clean multi-variant Period/Start/End/Length table the flattened .txt had muddled. Pittsylvania's biggest win was a Student Handbook PDF, not a schedule page - camelot_hybrid mis-fired table detection on prose. Confirms a raw time-count is supporting evidence, not proof of quality."
      - "Heavy ML-model document tools (Docling, EasyOCR, PaddleOCR) were also installed and timed (13-120s/PDF for Docling depending on page count and one-time model download, ~29s/page EasyOCR, ~56s/page PaddleOCR steady-state) - see REQ-084 for why these were rejected, not just slow"
    tests:
      - data/benchmark_results/stage4_pdf_tool_spike/run_spike.py (exploratory harness, not a production test suite)
      - data/benchmark_results/stage4_pdf_tool_spike/summary.jsonl (the actual evidence - 1,650 rows, 150 PDFs x 11 kept+dropped fast tools)
    created: "2026-06-23T00:00:00Z"
    updated: "2026-06-23T00:00:00Z"
    notes: "Closes the watch-item this REQ originally recorded. requirements.txt updated to list only the
      kept tools' packages (pdfplumber, pymupdf, camelot-py, img2table stay installed for reference/possible
      revisit despite pymupdf/img2table being dropped from the active roster; docling/paddleocr/paddlepaddle/
      easyocr were uninstalled, not just unused, per REQ-084). See the diagram decision log for the full
      numbers and the Longfellow/Stroudsburg/Pittsylvania spot-checks."

  - id: REQ-084
