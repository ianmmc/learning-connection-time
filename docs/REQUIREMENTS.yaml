      BUILT 2026-07-03 as the prerequisite for Stage-7 request-execution (REQ-118): common/budget.py (pure
      caps: per-district PER-RUN, per-district TOTAL cumulative-across-all-handoffs, per-run, and
      max_request_rounds) + the config-as-data budget knob (common/config/budget.json, bootstrap) +
      pre-district enforcement in run_council_streaming (run cap HALTS; per-run and total per-district caps
      SKIP), seeded from durable SUM(extraction.cost_usd) — per-run scoped to the handoff, TOTAL across all
      handoffs so a hard district can't run up unbounded spend over many follow-up rounds. STILL OPEN: the
      WAF one-attempt rule at governor level."

  - id: REQ-052
    description: Define the school-sampling policy and document its representativeness limitation
    type: non-functional
    priority: should
    status: tested
    acceptance_criteria:
      - Sample size and selection rule defined as a function of district size and grade span (ties to REQ-043 discovery and REQ-042 aggregation)
      - District-band value is the MODE of sampled schools (REQ-042) with the distribution captured
      - Known limitation documented in METHODOLOGY - schedules are obtained only from schools that publish them, which may bias the sample
    created: "2026-06-13T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
    notes: "IMPLEMENTED_BY (status bumped accepted→tested 2026-06-26): queue-time sampling = REQ-063 (enrollment-quartile
      stratification) + REQ-064 (per-band selection, cross-band overlap minimization) + REQ-065 (school eligibility), all
      tested; the 12/band cap + 95/±5 rationale + publish-bias caveat documented in ACQUISITION_PIPELINE 'Sampling policy'.
      Extraction-time mode-stability early-exit remains open (ACQUISITION_PIPELINE Open-decision #1/#2). Complements REQ-042."

  - id: REQ-053
    description: Ground all extraction in captured artifacts and abstract LLM providers behind a multi-model gateway, keeping search separate from LLM querying
    type: constraint
    priority: must
    status: accepted
    acceptance_criteria:
      - LLMs produce instructional-minutes values ONLY from artifacts captured under REQ-045; they never source facts from model knowledge or from search-fused answers
      - Discovery/search (finding and fetching real pages) and extraction (reasoning over captured bytes) use separate services and separate calls; no single web-enabled model both finds and answers
      - Search-grounded tools (e.g. Perplexity Sonar) may propose candidate URLs only; the cited artifact is still captured and extracted independently before any value is accepted
      - Extraction and verification paths sit behind a provider-abstraction layer (e.g. an OpenRouter gateway and/or the benchmark extractors.py interface) so models can be swapped and compared without code changes
      - The 2-3 independent verification paths (REQ-048) draw from different model families through that abstraction
      - A citation or model-asserted value with no captured artifact is treated as not-found (REQ-049), never as enriched
    created: "2026-06-13T00:00:00Z"
    updated: "2026-06-13T00:00:00Z"
    notes: "Codifies the search-is-not-LLM principle - a bare LLM invents plausible schedules (the Rule 6
      hallucination failure). Native Anthropic stays available alongside the gateway for the Claude
      production batch (Batch API 50% off, prompt caching, PDF/Files input)."

  # ---------------------------------------------------------------------------
  # Per-school consensus + gross-minutes redesign (added 2026-06-21). Supersedes
  # REQ-042 (net), REQ-046 (deduction fields), REQ-048 (consensus on band number).
  # ---------------------------------------------------------------------------

  - id: REQ-054
    description: "INVARIANT — extraction models read TIMES only; deterministic code computes minutes and the mode"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Council/extraction models return ONLY per-school facts read from the artifact - {grade_level, start_time, end_time, school_name}
      - Models NEVER compute instructional minutes, never subtract lunch/passing/recess, never select a "typical"/modal/representative schedule
      - All minutes arithmetic (gross = end - start) is performed in Python code, not by a model
      - All aggregation (the per-band mode/mean over schools) is performed in Python code, not by a model
      - A prompt that asks a model to return minutes, or to pick the typical/modal schedule, is a violation of this requirement
    tests:
      - tests/test_aggregate.py::TestGross::test_gross_is_end_minus_start
      - tests/test_aggregate.py::TestGross::test_no_deduction_applied
      - tests/test_aggregate.py::TestMode::test_exact_mode_not_cluster_mean_380_not_381
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
    notes: "The principle the user locked down 2026-06-21. A prior design let models return pre-aggregated
      minutes and a triage prompt asked the model to pick the typical schedule; both removed. TEST RE-POINTING
      2026-06-26: this invariant has two halves. CODE-SIDE ('Python computes gross=end-start and the per-band
      mode, never the model') is LIVE and tested against aggregate.py (the tests listed above). PROMPT-SIDE
      ('models read TIMES only') was previously tested by importing the archived GT-era extractors.py
      (tests/test_aggregate.py::TestInvariant) — but that module's top-level import broke when infrastructure/api
      was removed (2026-06-25), so a live test depended on archived, broken code. TestInvariant was removed
      2026-06-26; the prompt-side half will be re-tested against the LIVE Stage-7 council extractor when built.
      See docs/ACQUISITION_PIPELINE.md (council INVARIANT) and docs/TERMINOLOGY.md."

  - id: REQ-055
    description: "Instructional minutes from bell schedules are GROSS (bell-to-bell), not net"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Daily instructional minutes from a bell schedule = last-bell end - first-bell start (end - start)
      - No lunch, passing-period, or recess deduction is applied
      - No ASSUMED deductions are applied (an assumed 30-min lunch is explicitly forbidden - it adds fake precision)
      - Values are labeled gross / bell_to_bell (e.g. minutes_basis = gross_bell_to_bell) wherever stored
      - Net minutes (with real deductions) is a deferred future enhancement, not attempted now
      - Plausibility gate for a gross day is ~240-510 minutes (raised from 480; real full days run to ~8.5h)
    tests:
      - tests/test_aggregate.py::TestGross::test_gross_is_end_minus_start
      - tests/test_aggregate.py::TestGross::test_no_deduction_applied
      - tests/test_aggregate.py::TestGross::test_plausibility_gate_240_510
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-21T00:00:00Z"
    notes: "Decided 2026-06-21. Existing GT was already gross; gross needs only two reliably-published
      numbers (improves extraction accuracy). Documented in METHODOLOGY.md, TERMINOLOGY.md, ACQUISITION_PIPELINE.md."

  - id: REQ-056
    description: "Council consensus is on per-school (start,end) times, cross-family; band value is the deterministic exact mode"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Consensus is evaluated PER SCHOOL on the (start_time, end_time) pair within +/-15 min, NOT on the computed minutes or the band rollup
      - Agreement only counts between models of DIFFERENT families (same-family agreement is not consensus); family buckets google/mistral/deepseek/qwen
      - Schools without cross-family agreement are held out as 'unresolved' (excluded from the band mode), never wrong-counted
      - A no-consensus school may be resolved by a JUDGE model (distinct family) that re-reads the artifact, subject to the plausibility gate
      - District band value = EXACT most-common (mode) of consensus schools' gross minutes; a genuine tie between distinct values falls back to arithmetic mean
      - The mode is the exact most-common value, NOT a tolerance-cluster mean (regression - {380x26,390x2,345x1} must give 380, not 381)
      - Per-school facts, which models agreed, and unresolved schools are all recorded for audit
    tests:
      - tests/test_aggregate.py::TestConsensus::test_cross_family_required
      - tests/test_aggregate.py::TestConsensus::test_same_family_not_consensus
      - tests/test_aggregate.py::TestConsensus::test_unresolved_held_out
      - tests/test_aggregate.py::TestConsensus::test_consensus_on_times_not_minutes
      - tests/test_aggregate.py::TestMode::test_exact_mode_not_cluster_mean_380_not_381
      - tests/test_aggregate.py::TestMode::test_mean_tiebreak_on_distinct_tie
      - tests/test_aggregate.py::TestModeStability::test_stable_run_and_plurality
      - tests/test_aggregate.py::TestModeStability::test_not_stable_when_scattered_or_bimodal
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-21T00:00:00Z"
    notes: "aggregate.py consensus_school_facts + district_bands_from_facts + aggregate_band + mode_stable.
      Cross-family rationale: docs/technical-notes/models-and-council-composition/LLM_COUNCIL_RESEARCH_2026-06.md. The 380-not-381 case
      was a user-caught cluster-mean bug fixed 2026-06-21."

  - id: REQ-057
    description: "[SUPERSEDED 2026-06-26 by REQ-105 — topology moved from search-results to Stage 5 labels+NCES] Classify district web topology (hub / per_school / none) from SEARCH RESULTS only, to route processing"
    type: functional
    priority: should
    status: superseded
    superseded_by: [REQ-105]
    acceptance_criteria:
      - The Wave-1 Claude WebSearch subagent classifies each district as hub (schedules on one district URL), per_school (distinct school subdomain/pages), or none (neither found)
      - Classification uses ONLY what the search results reveal; it does NOT open or read page contents
      - Whether a hub renders cleanly vs is an expanding/accordion edge case is a CAPTURE-stage determination, not the classifier's
      - Topology routes the downstream branch (capture-hub-once-and-fan vs extract-each-school-page)
      - The label is recorded (roster.json / claude_urls.json) and is checkable against hand topology labels
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
