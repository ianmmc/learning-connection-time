      - "A deterministic request-more-evidence loop detects representation/URL/district-altitude insufficiency and routes 7->6/3/2/1, with zero model calls — MET (stage7_extract/requests.py), validated against real data with zero false positives across 20 covered districts. REFACTORED 2026-07-29 (#694): the district altitude is SLOT-GRAIN — a band is pursued until SATISFIED (REQ-149) or out of open unfilled slots (the gate@8 projection via the ONE shared slot_spine module, read through requests.slot_gap_summary), directives name the specific unfilled schools, human slot dispositions are live inputs (reject excludes a slot from targets; confirm_extra counts as filled), and span-only (outside-Stage-1-pool) schools are bounded to MODE_CHECK_MAX assumption-check targets (#696). Emission, #233 withdrawal AND the compose suppression gate (plan_followup, #703 review — pre-fix it auto-rejected every covered-but-unsatisfied directive as 'already covered') share the ONE band_done predicate (no churn); slot view unavailable ⇒ the prior covered-band boolean (honest degradation). Measured corpus delta: 36/64 districts gain 58 directives naming 196+12 schools (2026-07-29-issue694-slot-grain-measurement.md)"
      - "gate@7 console: review extraction results (band rollup, accepted/unresolved facts) + approve/reject/reopen request-more-evidence directives; fact/band editing is OUT of scope (that's gate@8) — MET"
