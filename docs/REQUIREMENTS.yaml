  - id: REQ-113
    description: "Stage 5 scoring V2 — labeling-function decomposition + combiner + measured fixes.
      The V1 tier cascade (single if/elif; additive score for sort only) drifted at scale (85%→69% tier-A
      precision; tier-D leaked 10/110 targets, measured over 440 labels / 59 districts). V2 replaces the
      cascade with independent DETECTORS (labeling functions, stage5_filter/detectors.py — pure fns over the
      signal vector, config-driven) combined by a shallow transparent weighted vote (combiner.py) into a
      send/suppress/review routing decision; tier letters A-D retained as a derived human-legible summary.
      Fixes three measured V1 defects at ZERO recall cost on the 382 canonical labels: (1) de-chrome time
      signal over the MAX-evidence source (main ∪ footer/header ∪ best raw rep), not page.main.txt exclusively
      (recovers footer 'Hours:' + OCR/raster targets stuck at tier D); (2) weak-target detector requires a
      proximity pair (was tier-B n_times_in_window>=2 with no positive requirement — drops 13/38 FPs);
      (3) suppress floor = no in-window times (was n_times==0 — reclassifies 35/61 tier-C non-targets). New
      deterministic signals from ALREADY-captured data: footer/header times, heading-adjacent hours (+ the
      matched heading label), table time-density, cms_hint promotion (grouping key, not a score input). Harness
      extended with per-detector diagnostics (coverage/accuracy/overlap/conflict — Snorkel LFAnalysis). Grounded
      in docs/technical-notes/filtering-research/ (weak supervision; FrugalGPT/SUPG cascades)."
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - detectors.py exposes pure labeling functions (signals)->{vote,confidence,reason}; combiner.py reduces votes to a send/suppress/review decision + a derived tier; both config-as-data driven
      - time signals compute over the max-evidence source (main ∪ footer/header segment ∪ best raw rep); a footer/OCR-only 'Hours:' target is no longer zeroed by de-chrome
      - weak-target routing requires a proximity pair; the suppress floor is n_times_in_window==0; both verified to cost 0 targets on the canonical labels via the harness
      - new signals (footer_times, header_times, heading_hours_hits + heading label, table_time_density, cms_hint) are stored in signals_json at ingest with no re-capture
      - harness reports per-detector coverage/accuracy/overlap/conflict against the human facets/labels; a re-ingest before/after episode is recorded in the tuning ledger
      - "`instructional_time` marks a DECLARATION of the school day, never an interval/rate inside it (#683, 2026-07-29): a number + an instruction referent + DAY scope, with an interval/threshold antecedent guard; the ONE home is build_signals.instructional_declaration() (the bare INSTRUCTIONAL_RE is not the predicate — the guard is half the rule, source-pinned). MEASURED over the labeled corpus: fired on 15 records, wrong on 13; lf_explicit_minutes accuracy 0.4545 -> 1.0 (the bank's worst target detector became its most accurate), tier-A non-targets 62 -> 58, tier-A precision +0.0069 with recall UNCHANGED (every target-labeled record that lost the signal stays tier A on other detectors). Strictly narrowing, 0 records gained. Widening stays disproven (REQ-093's hours reversion). Report: 2026-07-29-issue683-instructional-declaration-measurement.md"
      - "A negative detector `lf_staff_day` distinguishes the STAFF day from the student day (#684, 2026-07-29): employment-obligation CLAUSES (staff subject -> duty verb -> the time) governing MORE of a text basis's in-window times than student-referent language does. Per basis (offsets never cross texts), ANY-basis, threshold-free (a comparison, not a tuned dominance level). Registered `hard` in UNDERMINE_CLASS AND consulted by lf_heading_hours — a negative vote alone cannot fix this, because nothing undermines STRONG_STRUCTURAL. HOLD, never veto (#241): Bentonville `0503060:a5f32ff869` goes tier A/send -> tier B/review, not D. MEASURED: acc 1.000, 0 labeled targets, 7 records carry a duty clause and exactly 1 reads staff-owned. The issue's own proposed shape (widen OFFICE_HOURS_KW; vote on a staff word NEAR a time) was measured and REJECTED — acc 0.512, it would demote 59 tier-A targets to save 10 false sends; a doc-level /employee handbook/ match is net-negative too (11 of 17 labeled hits are real targets). Report + rerunnable script: 2026-07-29-issue684-staff-day-confusable-measurement.md"
    tests:
      - tests/test_683_instructional_declaration.py
      - tests/test_684_staff_day_confusable.py
      - tests/test_stage5_scoring.py
      - tests/test_stage5_detectors.py
    created: "2026-07-01T00:00:00Z"
    updated: "2026-07-01T00:00:00Z"
    notes: "MERGED to main (PR #3, cde04e9). Measured over 440 labels: tier-A precision 0.79 / recall 0.88 /
      tier-D 0-target leak / A+B recall 1.0. Design: STAGE5_FILTER_DESIGN.md §2 (detectors/combiner)
      + §5 (harness). Open follow-on: facet-level per-detector scoring (as v2.1 re-tagging fills facets).
      NOTE (fable review 2026-07-01): the V1 remnants (tier_and_category / DEFAULT_TIER_PARAMS / frontier.py)
      are still in-tree but dead on the ingest path — retire or re-point frontier at DEFAULT_DETECTOR_PARAMS;
      REQ-093/096 still reference the V1 cascade and need reconciling."

