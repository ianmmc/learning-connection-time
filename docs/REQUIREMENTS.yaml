    github_issue: "#105 — WAF one-attempt rule (remaining sub-item; governor core built) (doc-migration 2026-07)"
    description: Bound API spend and effort per district and globally, with a resumable batch (budget governor)
    type: constraint
    priority: must
    status: accepted
    acceptance_criteria:
      - Enforces per-district caps on API spend and/or search+extraction attempts, stopping once enough bands are confidently found
      - Enforces a global run budget cap; the run halts or degrades to fallback when exceeded
      - Enforces the ONE-attempt rule on WAF/CDN blocks (Rule 3) at the governor level
      - Batch is checkpointed, resumable, and idempotent per district (re-running does not duplicate; REQ-041 pattern)
      - Per-district and per-run cost/usage are recorded
    tests:
      - tests/test_budget.py
      - tests/test_stage7_streaming.py::test_budget_run_cap_halts_before_paid_district
      - tests/test_stage7_streaming.py::test_budget_district_cap_skips_but_run_continues
    created: "2026-06-13T00:00:00Z"
    updated: "2026-07-03T00:00:00Z"
    notes: "New requirement introduced by the shift to paid APIs; prevents an agentic search/extract loop
      from running up cost on hard districts. Cost-minimization itself is deferred (do-it-right-first).
      BUILT 2026-07-03 as the prerequisite for Stage-7 request-execution (REQ-118): common/budget.py (pure
      caps: per-district PER-RUN, per-district TOTAL cumulative-across-all-handoffs, per-run, and
      max_request_rounds) + the config-as-data budget knob (common/config/budget.json, bootstrap) +
      pre-district enforcement in run_council_streaming (run cap HALTS; per-run and total per-district caps
      SKIP), seeded from durable SUM(extraction.cost_usd) — per-run scoped to the handoff, TOTAL across all
      handoffs so a hard district can't run up unbounded spend over many follow-up rounds. STILL OPEN: the
      WAF one-attempt rule at governor level."

  - id: REQ-052
    description: Define the school-sampling policy and document its representativeness limitation
    type: non-functional
    priority: should
    status: tested
    acceptance_criteria:
      - Sample size and selection rule defined as a function of district size and grade span (ties to REQ-043 discovery and REQ-042 aggregation)
      - District-band value is the MODE of sampled schools (REQ-042) with the distribution captured
      - Known limitation documented in METHODOLOGY - schedules are obtained only from schools that publish them, which may bias the sample
    created: "2026-06-13T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
    notes: "IMPLEMENTED_BY (status bumped accepted→tested 2026-06-26): queue-time sampling = REQ-063 (enrollment-quartile
      stratification) + REQ-064 (per-band selection, cross-band overlap minimization) + REQ-065 (school eligibility), all
      tested; the 12/band cap + 95/±5 rationale + publish-bias caveat documented in ACQUISITION_PIPELINE 'Sampling policy'.
      Extraction-time mode-stability early-exit remains open (ACQUISITION_PIPELINE Open-decision #1/#2). Complements REQ-042."

  - id: REQ-053
    description: Ground all extraction in captured artifacts and abstract LLM providers behind a multi-model gateway, keeping search separate from LLM querying
    type: constraint
    priority: must
    status: accepted
    acceptance_criteria:
      - LLMs produce instructional-minutes values ONLY from artifacts captured under REQ-045; they never source facts from model knowledge or from search-fused answers
      - Discovery/search (finding and fetching real pages) and extraction (reasoning over captured bytes) use separate services and separate calls; no single web-enabled model both finds and answers
      - Search-grounded tools (e.g. Perplexity Sonar) may propose candidate URLs only; the cited artifact is still captured and extracted independently before any value is accepted
      - Extraction and verification paths sit behind a provider-abstraction layer (e.g. an OpenRouter gateway and/or the benchmark extractors.py interface) so models can be swapped and compared without code changes
      - The 2-3 independent verification paths (REQ-048) draw from different model families through that abstraction
      - A citation or model-asserted value with no captured artifact is treated as not-found (REQ-049), never as enriched
    created: "2026-06-13T00:00:00Z"
    updated: "2026-06-13T00:00:00Z"
    notes: "Codifies the search-is-not-LLM principle - a bare LLM invents plausible schedules (the Rule 6
      hallucination failure). Native Anthropic stays available alongside the gateway for the Claude
      production batch (Batch API 50% off, prompt caching, PDF/Files input)."

  # ---------------------------------------------------------------------------
  # Per-school consensus + gross-minutes redesign (added 2026-06-21). Supersedes
  # REQ-042 (net), REQ-046 (deduction fields), REQ-048 (consensus on band number).
  # ---------------------------------------------------------------------------

  - id: REQ-054
    description: "INVARIANT — extraction models read TIMES only; deterministic code computes minutes and the mode"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Council/extraction models return ONLY per-school facts read from the artifact - {grade_level, start_time, end_time, school_name}
      - Models NEVER compute instructional minutes, never subtract lunch/passing/recess, never select a "typical"/modal/representative schedule
      - All minutes arithmetic (gross = end - start) is performed in Python code, not by a model
      - All aggregation (the per-band mode/mean over schools) is performed in Python code, not by a model
      - A prompt that asks a model to return minutes, or to pick the typical/modal schedule, is a violation of this requirement
      - "Extended to the v2/v3 evidence fields (evidence_quote, source_locus, stated_minutes) and the v3
        school_year/applies_to fields (REQ-141) — each is a verbatim READING the model copies from the
        document text, never an inference — a v3 prompt explicitly forbids inferring school_year from
        the URL, domain, or today's date, and null is the correct answer when the page doesn't state one"
    tests:
      - tests/test_aggregate.py::TestGross::test_gross_is_end_minus_start
      - tests/test_aggregate.py::TestGross::test_no_deduction_applied
      - tests/test_aggregate.py::TestMode::test_exact_mode_not_cluster_mean_380_not_381
      - tests/test_stage6_requests.py::test_prompt_registry_has_variants_and_never_computes_minutes
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
    notes: "The principle the user locked down 2026-06-21. A prior design let models return pre-aggregated
      minutes and a triage prompt asked the model to pick the typical schedule; both removed. TEST RE-POINTING
      2026-06-26: this invariant has two halves. CODE-SIDE ('Python computes gross=end-start and the per-band
      mode, never the model') is LIVE and tested against aggregate.py (the tests listed above). PROMPT-SIDE
      ('models read TIMES only') was previously tested by importing the archived GT-era extractors.py
      (tests/test_aggregate.py::TestInvariant) — but that module's top-level import broke when infrastructure/api
      was removed (2026-06-25), so a live test depended on archived, broken code. TestInvariant was removed
      2026-06-26; the prompt-side half will be re-tested against the LIVE Stage-7 council extractor when built.
      See docs/ACQUISITION_PIPELINE.md (council INVARIANT) and docs/TERMINOLOGY.md."

  - id: REQ-055
    description: "Instructional minutes from bell schedules are GROSS (bell-to-bell), not net"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Daily instructional minutes from a bell schedule = last-bell end - first-bell start (end - start)
      - No lunch, passing-period, or recess deduction is applied
      - No ASSUMED deductions are applied (an assumed 30-min lunch is explicitly forbidden - it adds fake precision)
      - Values are labeled gross / bell_to_bell (e.g. minutes_basis = gross_bell_to_bell) wherever stored
      - Net minutes (with real deductions) is a deferred future enhancement, not attempted now
      - Plausibility gate for a gross day is ~240-510 minutes (raised from 480; real full days run to ~8.5h)
    tests:
      - tests/test_aggregate.py::TestGross::test_gross_is_end_minus_start
      - tests/test_aggregate.py::TestGross::test_no_deduction_applied
      - tests/test_aggregate.py::TestGross::test_plausibility_gate_240_510
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-21T00:00:00Z"
    notes: "Decided 2026-06-21. Existing GT was already gross; gross needs only two reliably-published
      numbers (improves extraction accuracy). Documented in METHODOLOGY.md, TERMINOLOGY.md, ACQUISITION_PIPELINE.md."

  - id: REQ-056
    description: "Council consensus is on per-school (start,end) times, cross-family; band value is the deterministic exact mode"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Consensus is evaluated PER SCHOOL on the (start_time, end_time) pair within +/-15 min, NOT on the computed minutes or the band rollup
      - Agreement only counts between models of DIFFERENT families (same-family agreement is not consensus); family buckets google/mistral/deepseek/qwen
      - Schools without cross-family agreement are held out as 'unresolved' (excluded from the band mode), never wrong-counted
      - A no-consensus school may be resolved by a JUDGE model (distinct family) that re-reads the artifact, subject to the plausibility gate
      - District band value = EXACT most-common (mode) of consensus schools' gross minutes; a genuine tie between distinct values falls back to arithmetic mean
      - The mode is the exact most-common value, NOT a tolerance-cluster mean (regression - {380x26,390x2,345x1} must give 380, not 381)
      - Per-school facts, which models agreed, and unresolved schools are all recorded for audit
    tests:
      - tests/test_aggregate.py::TestConsensus::test_cross_family_required
      - tests/test_aggregate.py::TestConsensus::test_same_family_not_consensus
      - tests/test_aggregate.py::TestConsensus::test_unresolved_held_out
      - tests/test_aggregate.py::TestConsensus::test_consensus_on_times_not_minutes
      - tests/test_aggregate.py::TestMode::test_exact_mode_not_cluster_mean_380_not_381
      - tests/test_aggregate.py::TestMode::test_mean_tiebreak_on_distinct_tie
      - tests/test_aggregate.py::TestModeStability::test_stable_run_and_plurality
      - tests/test_aggregate.py::TestModeStability::test_not_stable_when_scattered_or_bimodal
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-21T00:00:00Z"
    notes: "aggregate.py consensus_school_facts + district_bands_from_facts + aggregate_band + mode_stable.
      Cross-family rationale: docs/technical-notes/models-and-council-composition/LLM_COUNCIL_RESEARCH_2026-06.md. The 380-not-381 case
      was a user-caught cluster-mean bug fixed 2026-06-21."

  - id: REQ-057
    description: "[SUPERSEDED 2026-06-26 by REQ-105 — topology moved from search-results to Stage 5 labels+NCES] Classify district web topology (hub / per_school / none) from SEARCH RESULTS only, to route processing"
    type: functional
    priority: should
    status: superseded
    superseded_by: [REQ-105]
    acceptance_criteria:
      - The Wave-1 Claude WebSearch subagent classifies each district as hub (schedules on one district URL), per_school (distinct school subdomain/pages), or none (neither found)
      - Classification uses ONLY what the search results reveal; it does NOT open or read page contents
      - Whether a hub renders cleanly vs is an expanding/accordion edge case is a CAPTURE-stage determination, not the classifier's
      - Topology routes the downstream branch (capture-hub-once-and-fan vs extract-each-school-page)
      - The label is recorded (roster.json / claude_urls.json) and is checkable against hand topology labels
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
    notes: "SUPERSEDED: Stage 2 DELIBERATELY DROPPED search-result topology (not enough signal before reading
      page content; ACQUISITION_PIPELINE Stage 2 'Topology classification — dropped'). Topology is now derived at
      Stage 5 as `labeled_topology` from human labels + the NCES school count (the `guessed_topology` from
      roster-name signals is kept only to MEASURE the heuristic). Replaced by REQ-105. Hand topology labels for
      ~27 GT districts remain in gt_curation CURATION_RECONCILED.json for validation."

  - id: REQ-058
    description: "[SUPERSEDED 2026-06-28 by REQ-104 — Stage 2 re-architected to a deterministic SERP
      cascade: Bright Data SERP Wave 1 + Serper failover -> Claude WebSearch Wave 2 on the residual;
      the agent-orchestrated Claude/OpenRouter waves and the per-school-acquire skill are retired.
      Still-good parts carried forward: domain scoping, cross-school dedup, sampling caps (REQ-052).]
      Per-school discovery via cost-ascending waves (Claude WebSearch -> OpenRouter gpt-4o-mini-search -> manual), stop-when-found"
    type: functional
    priority: must
    status: superseded
    superseded_by: [REQ-104]
    acceptance_criteria:
      - Discovery runs in waves and stops once a district/school is satisfied; it does NOT run all tools on every school
      - Wave 1 = Claude WebSearch (Haiku subagent, subscription); Wave 2 = OpenRouter gpt-4o-mini-search on the residual only; then flag for manual
      - Perplexity is NOT used (dropped 2026-06-21 - lowest full-41 coverage, hub-skewed reach)
      - Every wave is domain-scoped to the district domain (allowed_domains / site:)
      - Candidates are deduped across schools so a shared hub page is captured/extracted once and fanned to the schools it covers
      - Sampling caps per band (census small districts; cap large ~8-12/band with mode-stability early-exit) - not a 95/+-5 near-census
    tests:
      - tests/test_acquisition_stages.py::TestWaves::test_wave_order_no_perplexity
      - tests/test_acquisition_stages.py::TestSampling::test_band_classifier_grade_span
      - tests/test_acquisition_stages.py::TestSampling::test_sample_size_censuses_small
    created: "2026-06-21T00:00:00Z"
    updated: "2026-07-01T00:00:00Z"
    notes: "Superseded banner added 2026-07-01 (fable review — this req missed the banner pattern
      042/046/048/057 got). Historical: Wave 1 was agent-orchestrated via the per-school-acquire skill;
      REQ-104's deterministic cascade replaced it. TestWaves::test_wave_order_no_perplexity encodes the
      OLD wave order — retire with the next test-hygiene pass."

  - id: REQ-059
    description: "Ground truth is human-verified per-school start/end times; models propose, human confirms"
    type: process
    priority: must
    status: accepted
    acceptance_criteria:
      - GT districts are hand-curated from viewable source files (PDF/image); if a schedule can't be read by eye from the source, it is not GT
      - The council PROPOSES per-school start/end times; a human verifies each (confirmed / corrected times / reject / unsure) before it becomes GT
      - GT stores per-school start/end (the verifiable facts); the band value is re-derived deterministically (REQ-056) from confirmed schools
      - Automated triage of GT sources (regex band-attribution) is explicitly NOT trusted - it is the extraction problem itself
      - GT is GROSS (REQ-055) and labeled with provenance (source dir, topology, which models proposed)
    tests:
      - tests/test_acquisition_stages.py::TestGTProcess::test_band_rederived_from_confirmed_schools
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-21T00:00:00Z"
    notes: "Process requirement capturing the 'I draft, you verify' GT method (memory:
      feedback-human-curates-ground-truth). Workspace: data/benchmark/gt_curation_<ts>/; proposal runner
      infrastructure/acquisition/gt_propose.py."

  - id: REQ-060
    description: "Tag charter schools (NCES CHARTER_TEXT), do NOT exclude them — preserves future analysis options"
    type: functional
    priority: should
    status: tested
    acceptance_criteria:
      - Charter schools are NOT filtered out of sampling, GT, or the acquisition pipeline (no charter exclusion exists or should)
      - Each per-school record carries is_charter sourced from the NCES CHARTER_TEXT flag - 'Yes' / 'No' / 'unknown' (school not matched in that LEA's NCES roster)
      - The tag is sourced from NCES, never inferred from OCR text or model output
      - Consistent with METHODOLOGY Rule 5 (use NCES LEA structure for charter treatment); charters are included as ordinary schools under NCES structure
      - Tagging enables later with/without-charter analysis slices without re-running extraction
    tests:
      - tests/test_acquisition_stages.py::TestCharter::test_charter_lookup_from_nces
      - tests/test_acquisition_stages.py::TestCharter::test_unmatched_school_is_unknown
    created: "2026-06-21T00:00:00Z"
    updated: "2026-06-21T00:00:00Z"
    notes: "Decided 2026-06-21 (user: tag-not-exclude, for future options). Charters are a small minority
      within a district's band (e.g. 5 of Fairbanks' 18 elementaries) so they don't move the mode, but
      tagging keeps the option open. school_sampling.charter_lookup; applied in gt_propose.py."

  - id: REQ-061
    description: "Exclude CTC / shared-service entities from LCT calculation and the acquisition queue (METHODOLOGY.md Rule 6)"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Districts matching career/technical/vocational/jted/cted name patterns OR NCES LEA_TYPE_TEXT in {Specialized public school district, Service agency, State operated agency} are flagged is_career_technical_center=True and is_shared_service_entity=True
      - Charter LEAs (LEA_TYPE_TEXT containing "charter") are never flagged, even when their name matches the keyword pattern - tagged per REQ-060 instead, never excluded
      - The exclusion is enforced in both calculate_lct_variants.py (LCT calculation, via is_shared_service_entity) and queue_batch.py (acquisition queue eligibility)
      - The backfill is idempotent - re-running after expanding the criteria only adds flags, never reverts one
    tests:
      - tests/test_acquisition_stages.py::TestCTCExclusion::test_known_ctc_flagged
      - tests/test_acquisition_stages.py::TestCTCExclusion::test_charter_with_career_branding_not_flagged
    created: "2026-06-22T00:00:00Z"
    updated: "2026-06-22T00:00:00Z"
    notes: "The schema columns existed since the rule was designed (PA_CTC_DATA_DISCREPANCY.md)
      but the backfill was never actually run until 2026-06-22 - the exclusion was a silent no-op in every prior
      LCT calculation. Initial backfill (152 districts, name-pattern only) missed Pima County JTED ('JTED' doesn't
      spell 'technical') when it surfaced in a real acquisition batch; expanded to the LEA_TYPE_TEXT blanket rule
      (600 districts). Known accepted trade-off: the blanket LEA_TYPE_TEXT rule also catches some legitimate
      full-time special-purpose state schools (deaf/blind institutes, fine-arts academies) that aren't really
      CTCs - deferred, see METHODOLOGY.md Rule 6. infrastructure/database/migrations/apply_ctc_classification.py."

  - id: REQ-062
    description: "Pre-queue district-level exclusion filters for Stage 1 (Queue) - operating status, CTC, grade-span integrity, already-attempted"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - A district is excluded from the eligible pool if its LEA-level SY_STATUS_TEXT != "Open"
      - A district is excluded if districts.is_shared_service_entity is True (REQ-061)
      - A district is excluded AND logged if its LEA-level claimed grade span includes a band with zero school-level coverage (Rule 7, grade-span integrity)
      - A district is excluded if it has reached Stage 3 (Capture) or beyond in the district_status.json registry, regardless of outcome (REQ-067) - a district that only reached Stage 1 (queue) or Stage 2 (discover) has had no real, costly attempt yet and remains eligible for redraw
      - All four filters are live/recomputed every run, never a persisted exclusion list - a future policy change lets a district back in for free
    tests:
      - tests/test_acquisition_stages.py::TestPreQueueExclusion::test_grade_span_gap_excludes_phantom_lea
      - tests/test_acquisition_stages.py::TestPreQueueExclusion::test_healthy_district_is_eligible
      - tests/test_acquisition_stages.py::TestPreQueueExclusion::test_stage1_only_district_stays_eligible_for_redraw
      - tests/test_acquisition_stages.py::TestPreQueueExclusion::test_captured_district_is_excluded_from_redraw
    created: "2026-06-22T00:00:00Z"
    updated: "2026-06-22T00:00:00Z"
    notes: "infrastructure/acquisition/discovery/queue_batch.py::eligible_pool. Rule 7 (grade-span integrity)
      excluded ~985 districts on the first full run against the 2024-25 NCES corpus - e.g. Alabama Youth Services
      claims KG-12 at LEA level but has zero schools listed anywhere in ccd_sch_029, not even closed ones.
      Already-attempted threshold corrected 2026-06-22 to Stage 3+ (see REQ-067 notes) - excluding on ANY
      stage masked a Stage 1 bug fix by silently dropping every district from the never-captured batch_00001
      on re-queue. See docs/ACQUISITION_PIPELINE.md Stage 1, docs/METHODOLOGY.md Rule 7."

  - id: REQ-063
    description: "Enrollment-quartile stratified district sampling for acquisition batch composition"
    type: functional
    priority: should
    status: tested
    acceptance_criteria:
      - The eligible pool is split into 4 equal-COUNT enrollment quartiles, not equal-value-range (NCES enrollment is heavily right-skewed)
      - A batch targets 3 districts per quartile (12 total by default)
      - Each individual pick prefers a state not yet used in the batch, seeded-shuffled otherwise
      - If a quartile runs short, the batch tops up from the remaining eligible pool until the target size is reached or the pool is exhausted
      - The same batch_id always produces the same pick from the same pool (reproducible, logged)
    tests:
      - tests/test_acquisition_stages.py::TestStratifiedSampling::test_spans_enrollment_range_no_duplicates
      - tests/test_acquisition_stages.py::TestStratifiedSampling::test_reproducible_with_same_seed
      - tests/test_acquisition_stages.py::TestStratifiedSampling::test_tops_up_when_pool_smaller_than_n
    created: "2026-06-22T00:00:00Z"
    updated: "2026-06-22T00:00:00Z"
    notes: "infrastructure/acquisition/discovery/queue_batch.py::stratified_pick. Supersedes training_batch.py's
      school-count-tier stratification (archived to data/archive/training_batch_py-superseded-20260622/) -
      enrollment + state chosen over staff-count/school-count as separate axes, which were judged too collinear
      with enrollment to buy independent coverage."

  - id: REQ-064
    description: "Per-band school selection with cross-band overlap minimization"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Up to 12 schools per band are targeted per district; a band with <=12 candidates gets a full census
      - Bands are processed most-constrained-first (ascending by candidate-pool size) within a district
      - Each band samples from schools not yet claimed by an earlier-processed band before considering reuse
      - A school already claimed by an earlier-processed band is only reused if the unclaimed pool can't fill the cap
      - Selection is a seeded random sample, reproducible from (batch_id, district_id, band)
    tests:
      - tests/test_acquisition_stages.py::TestPerBandSchoolSelection::test_most_constrained_first_minimizes_overlap
      - tests/test_acquisition_stages.py::TestPerBandSchoolSelection::test_seeded_sample_is_reproducible
    created: "2026-06-22T00:00:00Z"
    updated: "2026-06-22T00:00:00Z"
    notes: "infrastructure/acquisition/discovery/queue_batch.py::select_schools. Validated against real Fairbanks
      AK (0200600) data: independent per-band sampling produced 3 overlapping schools between elementary and
      middle; most-constrained-first reduced this to 1 unavoidable overlap (forced because the high band's full
      9-school census left middle only 11 unclaimed against its cap of 12)."

  - id: REQ-065
    description: "School-level eligibility filtering for bell-schedule sampling - regular schools only, no standalone preschools"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Only NCES SCH_TYPE_TEXT="Regular School" is eligible for per-band candidate pools
      - Alternative School, Career and Technical School, and Special Education School are excluded
      - Standalone preschool/early-childhood schools (GSHI in ("PK","KG"), no grade-1+) are excluded
      - A normal K-5 school that also offers PK (GSLO=PK, GSHI=05) is NOT excluded by the preschool rule
      - Exclusion is based on NCES structural fields (SCH_TYPE_TEXT, GSHI), never school-name pattern matching
      - Majority/exclusively-virtual schools (NCES ccd_sch_129 VIRTUAL_TEXT in "Exclusively virtual"/"Primarily virtual") are excluded - no real in-person bell-to-bell day to sample
      - A school with VIRTUAL_TEXT="Supplemental Virtual" (a normal in-person school that also offers a virtual option) is NOT excluded
    tests:
      - tests/test_acquisition_stages.py::TestSchoolEligibilityFiltering::test_alternative_school_excluded
      - tests/test_acquisition_stages.py::TestSchoolEligibilityFiltering::test_career_technical_school_excluded
      - tests/test_acquisition_stages.py::TestSchoolEligibilityFiltering::test_standalone_preschool_excluded
      - tests/test_acquisition_stages.py::TestEarlyChildhoodExclusion::test_pk_kg_only_center_excluded
      - tests/test_acquisition_stages.py::TestEarlyChildhoodExclusion::test_normal_k5_school_not_excluded
      - tests/test_acquisition_stages.py::TestVirtualSchoolExclusion::test_exclusively_virtual_school_excluded
      - tests/test_acquisition_stages.py::TestVirtualSchoolExclusion::test_supplemental_virtual_school_not_excluded
    created: "2026-06-22T00:00:00Z"
    updated: "2026-06-22T00:00:00Z"
    notes: "infrastructure/acquisition/discovery/school_sampling.py::school_index. Found via CP-A human review of
      a real batch (batch_00001): Olympic Peninsula HomeConnection (Alternative School, a homeschool-umbrella
      program), Lake Preschool (standalone PK), and Jackson County Vocational Center (Career and Technical
      School, a school-level CTC invisible to the LEA-level REQ-061 exclusion since the surrounding LEA isn't a
      CTC) all surfaced as schools that should never have been selected. Special Education School exclusion is
      an accepted, deferred gap - the project's SPED staffing work already flags this category for dedicated
      attention later, not a clean fit for this filter's rationale. Extended same day after adding gslo/gshi to
      the JSON for human inspection surfaced Clinton County Early Childhood Center (GSLO=PK, GSHI=KG) - the
      GSHI=='PK'-only rule missed it; extended to GSHI in ('PK','KG'). Virtual-school exclusion added 2026-06-22
      (CP-A review of a regenerated batch): Virginia Connections Academy (Pearson-operated, Scott County VA,
      LEVEL=Secondary so it was being rescued into both middle and high) confirmed VIRTUAL_TEXT='Exclusively
      virtual' in ccd_sch_129."

  - id: REQ-066
    description: "LEVEL-primary band classification with recursive grade-range grouping for whatever LEVEL leaves unresolved"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - A school whose NCES LEVEL is a clean Elementary/Middle/High is assigned to exactly that one band, regardless of grade-range overlap with an adjacent band
      - Grade 13 counts as part of the high band (a real, sanctioned NCES code some states use for a continuation/extra-year high school program) rather than vanishing from band classification entirely
      - For a district whose schools' distinct grade spans form a clean ascending, non-overlapping, contiguous partition, recursive_band_groups() resolves elementary by structural position (consecutive leading segments with top grade <=6 collapse into elementary, handling 1-3+ elementary sub-segments) but resolves middle/high by a PER-SEGMENT overlap check, not position: every segment not claimed by the elementary prefix joins middle if its own span starts at grade <=8, and joins high if its own span ends at grade >=9 - a segment can join both (middle+high merged, no separate middle identity exists) or just one, and a segment whose own span doesn't start within elementary's range must never join elementary just because it's first
      - A lone non-elementary segment with no separate middle identity (e.g. a single 07-12 LEVEL=High school) must resolve to middle+high only, NOT elementary, even though it has no leading segment in front of it
      - A trailing segment after an elem+middle-merged leading segment is classified by its OWN span, not by coming last - a segment that doesn't reach grade 9 stays in middle even if it's the final segment in the partition
      - A segment whose span fully covers middle (e.g. a PK-08 elementary) must not cause a later, distinct high segment to also be claimed by middle - middle/high membership is independent per segment
      - An ambiguous-LEVEL school (Other/Secondary/Not reported/Ungraded/blank) may join a band the recursive grouping assigns it to even if that band already has LEVEL-clean coverage from other schools (a 9th-grade campus must join an already-populated high band, not be dropped)
      - A LEVEL-clean school may ONLY be added to an additional band via recursion if that band was a genuine gap (no LEVEL-clean coverage at all) - it must never be added to a second band that already has separate LEVEL-clean coverage, which would reintroduce the original dilution bug
      - If a district's spans do NOT form a clean partition (genuinely different/overlapping spans on one side, e.g. multiple elementary buildings with different ranges, one subsuming another), fall back to the any-overlap rescue (bands_for_rescue())
      - In the any-overlap rescue, a school must reach grade 7 to count as touching middle - topping out at grade 6 alone is treated as pure elementary (mirrors the clean-partition per-segment rule), so a grade-6-topping elementary does not dilute middle's candidate pool just because grade 6 sits in the nominal 6-8 middle range
      - Multiple schools sharing an IDENTICAL grade span (different buildings, same shape) collapse to one logical segment and are treated identically to a single-building district with the same shape
    tests:
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_grade_13_counts_as_high
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_dilution_fixed_fayette_county
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_no_middle_level_school_rescues_via_grade_range
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_misnamed_elementary_with_middle_level_goes_to_middle_only
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_two_segment_partition_middle_high_merge
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_redundant_overlapping_spans_keep_any_overlap_fallback
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_identical_span_multi_building_partition_now_resolved
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_ambiguous_level_school_spanning_full_range_gets_all_bands
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_ambiguous_school_joins_already_populated_band
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_k8_feeder_district_has_no_high_band
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_lone_secondary_segment_does_not_join_elementary
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_trailing_segment_stays_middle_not_high_by_position
      - tests/test_acquisition_stages.py::TestLevelPrimaryBandClassification::test_pk08_elementary_does_not_over_claim_into_trailing_high
      - tests/test_acquisition_stages.py::TestAnyOverlapRescueMiddleBoundary::test_grade6_topping_school_not_rescued_into_middle
    created: "2026-06-22T00:00:00Z"
    updated: "2026-06-22T00:00:00Z"
    notes: "infrastructure/acquisition/discovery/school_sampling.py::primary_bands_for, bands_for,
      bands_for_rescue, recursive_band_groups, _clean_ascending_partition. Found via CP-A human review of
      batch_00001: pure grade-range classification diluted Fayette County IN's real middle school (Connersville
      Middle, 1 school) 6-to-1 with 5 unrelated K-6 elementary schools that merely clipped the boundary grade.
      The grade-13 fix was found while tracing why Jackson County MS's Vocational Center looked like the sole
      high-band candidate - its three real comprehensive high schools (coded 09-13) were silently invisible to
      the old classifier; 222 open schools nationally use GSHI=13. bands_for_rescue() added 2026-06-22 after
      West Bonner County ID's two PK-06 elementaries (IDAHO HILL, PRIEST RIVER) were wrongly rescued into middle
      under plain bands_for() within the any-overlap fallback - the same dilution bug the LEVEL-primary/
      per-segment fixes above already solved for the clean-partition path, just not yet for this fallback.
      Re-running the fix against Breathitt County KY (an existing test fixture) surfaced the identical bug there
      too - Sebastian and Highland-Turner Elementary (both top out at grade 6) no longer dilute middle; the test
      assertion was corrected to match.

      An initial fix (exactly-2-school 'largest overlap wins' tie-break) was scoped narrowly to avoid touching
      Breathitt County KY/Chama Valley NM/Northern Tioga PA (3+ schools). That scoping turned out to be wrong:
      profiling the full NCES corpus (17,265 districts) against a user-built reference table of recognized
      grade-band shapes showed the real dividing line isn't school COUNT, it's whether a district's distinct
      spans form a clean ascending partition at all. Northern Tioga's 3 elementaries share an IDENTICAL KG-06
      span and its 2 secondaries share an IDENTICAL 07-12 span - collapsed to distinct spans, that's the exact
      same 2-segment shape as Jasper Co. MO, and should get the same fix. Breathitt/Chama Valley are genuinely
      different (redundant/overlapping, non-identical elementary spans, e.g. one span entirely subsuming
      another) and correctly stay on the conservative fallback.

      Replaced the overlap-counting tie-break entirely with recursive_band_groups() - a general, explicit
      (no overlap-counting) rule validated against the full corpus: N=1 (6,079 districts) trivial; N=2 (~2,675)
      threshold at grade 7 (lower segment's top grade >=7 means elem+middle merged, confirmed against every row
      of the user's reference table); N=3 (~3,193) ordinal position; N=4-6 (~1,250) elementary and/or high
      sub-splits via the same leading-accumulation rule, validated against real examples (Albertville City AL
      elem x3 via clean LEVEL alone; Aledo ISD TX high x2, a 9th-grade campus + main campus). ~3,467 districts
      with genuinely redundant/overlapping spans (not a clean partition) and ~1,250 with 4+ way-too-fragmented
      shapes remain on the original any-overlap fallback, not yet further validated."

