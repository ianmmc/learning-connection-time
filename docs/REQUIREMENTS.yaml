  - id: REQ-120
    description: "Anti-survivorship exploration quota — a REVOCABLE autonomy license on gate@5 auto-suppression (control law, not a watched metric)"
    type: functional
    priority: should
    status: in-progress
    acceptance_criteria:
      - "The filter runs only as autonomously as its reject audit is currently validating it; a lapse DEMOTES gate@5 auto to manual (census mode) — it NEVER halts the pipeline (autonomy falls back one supervision level)"
      - "The binding sufficiency bar is a COUNT over a rolling window of CURRENT-config rejects (rule of three: ~300 zero-miss audited rejects ⇒ 95% confidence reject FN-rate < 1%), fed by a p%-of-flow sampler — NOT a cumulative percentage (a % floats above the bar on stale labels, is too thin on small streams, and re-imports the manual-inspection-at-100k-scale problem, commandment 2)"
      - "Selection randomness is enforced at DRAW time: the system presents a randomly-drawn audit queue the human works top-down and never cherry-picks; the sampler is reproducible (same keys/p/seed → identical), unbiased (independent per key), and GROWTH-STABLE (a key's decision never flips as the reject population grows), via a stable deterministic string-seeded draw (random.Random(seed), never the PYTHONHASHSEED-salted builtin hash())"
      - "Re-promotion uses a DEADBAND (re-promote only above ~1.2·floor, not merely at the floor) so coverage hovering at the floor cannot flap the gate auto↔manual; a collapsed/inverted deadband (promote_n <= floor_n) is a hard error"
      - "The honest recall signal is Rejection-Quality (reject-cohort false-negative rate + rule-of-three ceiling when zero misses), computed each cycle; diagnostics stratify by suspected bias axes (reader-tier / CMS-family / doc-format) to catch CORRELATED misses, but the hard gate is on the aggregate plus flagged strata only"
      - "Enforcement ships DORMANT: while gate@5 is configured manual the control law is inert (the demote-hook is a no-op — the census-labeling immunity means the recall metric is already honest); it goes live only when gate@5 is set to auto (the --assert-floor pattern, REQ-055/#208)"
      - "Every draw is logged (seed, rec_key, score/tier, outcome) so an outsider can replay 'you rejected class X; your own random audit surfaced it N times'; audit records are first-class run_kind=exploration_audit, walled off from production/funnel stats (#147/#148)"
      - "The sampler is CALIBRATED against census truth before it is relied on: a 3–5% random draw over completed (fully-labeled) districts must reproduce the reject-quality the full labels report; completed districts are attention-sorted (messiest-first) so this is a worst-case calibration"
      - "NOT: never impute reject labels (reject-inference entrenches/can reverse the bias); no active/uncertainty sampling as the primary mechanism (it under-covers the confident-reject region that entrenches a wrongly-rejected class)"
    tests:
      - tests/test_exploration_audit.py
    created: "2026-07-10T00:00:00Z"
    updated: "2026-07-10T00:00:00Z"
    notes: "PURE control-law core BUILT + tested first (infrastructure/acquisition/stage5_filter/exploration_audit.py:
      rule_of_three_upper_bound, rejection_quality, select_audit_sample, next_license_state, resolve_gate_mode) — no DB,
      no cash, the harness/frontier precedent; the invariant is locked in code before the live plumbing exists. Review round
      (#216, dcfc11b): the deadband refuses a collapsed/inverted band, gate-mode strings are validated, rate/quality sum to
      exactly 1.0, and the sampler reuses queue_batch's random.Random(seed) pattern. DEFERRED to the full #211 build: the
      live wiring (querying the reject population, presenting the randomized audit queue in the console, hooking the demote
      decision onto the gate@5 auto toggle) + Tier B (paid reject→Stage-7 extraction, likely never a distinct build — a
      confirmed false-negative just rejoins normal Stage-6→7 dispatch). Reframe (2026-07-10 design session with Ian): this is
      NOT a current hole — the operator census-labels every completed district (all tiers, rejects included), so harness
      recall (A+B 0.9961) is already honest; the quota is the instrument that REPLACES census-labeling, switched on before it
      stops (i.e. before gate@5 goes auto). Sibling instrument: REQ-121/#210 (calibration meter, same build-now-while-truth-
      exists logic). Authority: STAGE5_FILTER_DESIGN_2026-06.md §5a, PIPELINE_GOVERNANCE_AND_STATE_2026-06.md §11b,
      production-quality-control-research/FINDINGS-AND-DECISIONS.md §0/§1. Root cause the instrument is mandatory: the gate is
      deterministic (Swaminathan & Joachims — counterfactual correction impossible under deterministic filtering; only
      injected stochasticity recovers the signal)."

