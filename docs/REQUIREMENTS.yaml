  - id: REQ-086
    description: "Stage 3 per-record hosting/CMS fingerprint - raw signals only (no inline classification beyond a cheap CMS_HOSTS hint), recorded at the URL level, with a backfill mode for parity on pre-fingerprint captures"
    type: functional
    priority: should
    status: tested
    acceptance_criteria:
      - "Every captures.json record carries a fingerprint block of RAW signals: final_host, server, powered_by, cdn_hints[] (cloudflare/aws/vercel/github-pages/netlify/fastly/azure/google, presence-detected from response headers), meta_generator, resource_hosts[] (distinct off-domain script/link/img hostnames, own-host dropped, capped at 20), js_dependent (served-text-near-empty-but-rendered-substantial proxy; null for non-HTML records), cms_hint (host-suffix match against the same CMS_HOSTS set discover.py uses, null on no match)"
      - "Recorded at the URL level (per captures/<hash>/ record), not district level - school subdomains routinely run a different platform than the district root"
      - "Gathered for free from data the capture already held and discarded: the goto/fetch Response headers (previously only content-type was kept) plus one DOM evaluate alongside the existing emergent-anchor scan. No new network requests on the live path."
      - "Facts only - NO real CMS classification inline beyond cms_hint. Real platform identification is explicitly deferred to a later pure function over the raw signals (refinable retroactively without re-capture), same capture-facts-decide-downstream invariant as the rest of the pipeline"
      - "Direct PDF/image/Drive records get a reduced fingerprint (host + headers + cdn_hints only; meta_generator/resource_hosts null/empty, js_dependent null) since there is no DOM"
      - "backfill-fingerprints mode (node capture_discovery.mjs backfill-fingerprints <root> [conc]) re-visits each existing ok record, computes ONLY the fingerprint, and patches it into captures.json via versioned-redo - does NOT re-render/re-save page.* or touch any Stage 4 output, keeping processed.json valid (Stage 4 never reads fingerprints). Run live 2026-06-24: 150/150 records across all 12 batch_00001 districts, 0 errors."
      - "Parity via backfill was a deliberate choice over full re-capture, which would have mixed fresh Stage-3 artifacts with existing Stage-4 outputs in the same captures/<hash>/ dirs, left processed.json stale, and risked content drift - all to add one additive field"
      - "Pure helpers (hostOf, cdnHints, cmsHint, strippedLen, buildHtmlFingerprint, buildFetchFingerprint) are exported and unit-tested (capture_fingerprint.test.mjs, node:test); a main-module guard prevents importing the module for tests from triggering a capture run"
    tests:
      - infrastructure/scraper/capture_fingerprint.test.mjs (run via `npm test` in infrastructure/scraper/ alongside capture_drive.test.mjs - 14 total)
      - tests/test_acquisition_stages.py::TestDiscoveryGate (regression coverage for the CMS_HOSTS additions, which changed Stage 2 gate() recall)
    created: "2026-06-24T00:00:00Z"
    updated: "2026-06-24T00:00:00Z"
    notes: "First live run earned the feature's keep: cms_hint was null on all 150 (correctly - the real
      platforms in the sample were not in the discovery-era CMS_HOSTS), but raw resource_hosts revealed the
      actual landscape - SharpSchool (51 records), Apptegy/Thrillshare (~24), Educational Networks (25).
      RESOLVED 2026-06-24 (Open decision #8): those three vendors were human-approved and added to CMS_HOSTS
      in BOTH discover.py and capture_discovery.mjs (hand-synced), which also makes Stage 2 gate() keep
      slug-matched URLs on those hosts it previously rejected (a discovery-recall change, hence the new
      TestDiscoveryGate coverage). GOVERNANCE (the user's standing rule): every CMS_HOSTS addition is
      human-in-the-loop, never automated, and must be a school-district-specific vendor - NOT a general
      host/CDN (amazonaws.com deliberately excluded despite core-docs.s3.amazonaws.com in the data). The
      existing 12 districts' cms_hint was then re-derived in place via `capture_discovery.mjs
      recompute-cms-hint` - a pure recompute over stored resource_hosts (no browser/network), 107/150
      records updated: SharpSchool 59, Educational Networks 25, Apptegy 19, Thrillshare 4, null 43. That
      mode is the standing mechanism for applying future CMS_HOSTS changes to captured data without
