  - id: REQ-075
    description: "Stage 3 capture mechanics - modal dismissal and unconditional page.pdf() alongside innerText+screenshot for every HTML page"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - "Modal/cookie-consent overlays are dismissed before content capture: CSS-injection to hide overlays globally, then click known dismiss-button selectors, then DOM removal as a last resort - ported near-verbatim from capturer.ts, confirmed to have zero coupling to the dead Crawlee/Express-server architecture"
      - Modal dismissal is sequenced AFTER the existing 2.5s post-navigation wait, giving slow/deliberately-delayed cookie banners a window to actually render before dismissal is attempted
      - page.pdf() is captured unconditionally for every HTML page, alongside innerText (all frames) and a full-page screenshot - no multi-column-detection trigger, removing the need to ever define the Reader-Routing spec's previously-unsolved Tier 1->2 escalation trigger
