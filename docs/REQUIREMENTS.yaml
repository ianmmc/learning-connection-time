      - Tolerates HTTP-to-HTTPS certificate mismatches (ignoreHTTPSErrors) and browser-launch errors without aborting the district
      - Honors the ONE-attempt rule on Cloudflare/WAF/Akamai blocks (Rule 3) and records blocked districts in enrichment_attempts
      - Bounded by per-district effort caps (REQ-051) and degrades to statutory fallback when nothing is found (REQ-049)
