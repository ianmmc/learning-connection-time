  - id: REQ-125
    github_issue: "#89 — gate@8 closing-argument manual gate"
    description: "gate@8 (Stage 8 Aggregate) closing-argument review — per-band claim + evidence chain + negative space, human approve/send-back at district grain, with human override of extracted times feeding the band mode"
    type: functional
    priority: must
    status: tested
    acceptance_criteria:
      - Council v2/v3 extraction grounds every extracted (start,end) pair in a verbatim evidence_quote (+ optional source_locus), carried through consensus_school_facts into school_fact.evidence_json; v1 output stays byte-identical (no backfill)
      - The explicit-minutes second path (stated_minutes + stated_minutes_quote) is corroboration only — never computed, only copied from an explicit document statement (REQ-054 boundary)
      - closing_argument.py assembles, per band, the claim (school_fact), the evidence chain dereferenced via the immutable Stage-6 handoff (url/reps) + capture time, sampling sufficiency (NCES denominator, plurality share), and negative space (unresolved / contamination / unsatisfied bands / coverage gaps)
      - Approval is all-or-nothing at the DISTRICT (LCT is a district-level metric); each decision freezes the closing argument it acted on (receipt_json) plus a facts_fingerprint so a later re-extraction makes the approval detectably stale; a send-back requires a reason
