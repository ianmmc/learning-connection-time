  - id: REQ-163
    github_issue: "#608 / PR #609"
    description: "The console runs each batch's Stage 4 local-processing pass (pdftotext/pdfplumber/
      camelot/tesseract) in an ISOLATED OS SUBPROCESS, not an in-process thread. camelot's table
      extraction is backed by native code (pypdfium2/PDFium + OpenCV) that is not safe for concurrent
      multi-threaded use within one process; a crash there is a SIGSEGV that bypasses Python's exception
      handling entirely, so two batches' Stage-4 threads calling into the same native libraries at once
      (autoflow can trigger this for several batches concurrently) can segfault the whole console,
      killing every other batch's in-flight job with it."
    type: non-functional
    priority: must
    status: tested
    acceptance_criteria:
      - "server._run_stage4_subprocess launches headless.py's CLI as its own OS process per batch (python -u -m infrastructure.acquisition.stage4_process.headless run <batch_id> --batch-file <tmp>); headless.run_batch itself is UNCHANGED (still sequential, in-process) — only the console's invocation of it moved"
      - "the resolved batch dict crosses the process boundary via a temp file, never the on-disk queue receipt (#526's 'DB is the working store' rule)"
      - "the child streams one JSON line per event ([kind] {...}) on stdout for live progress, ending in exactly one terminal [summary]/[control_failure]/[error] line the parent parses"
      - "a process killed by a signal (e.g. SIGSEGV) is surfaced to the caller as a RuntimeError naming the signal — not silently swallowed, not misreported as a generic error"
      - "the child's stderr (native-library warnings, any traceback) is captured to a durable per-run log under paths.PROCESS_LOGS_DIR — the forensic record the original incident's investigation lacked"
      - "a CONTROL FAILURE (SystemExit) in the child is distinguished from a generic error/crash so both existing call sites' `except SystemExit` / `except Exception` handlers keep working unchanged"
    tests:
      - tests/test_stage4_subprocess.py
      - tests/test_process_api.py
      - tests/test_autoflow_api.py
    created: "2026-07-22T00:00:00Z"
    updated: "2026-07-22T00:00:00Z"
    notes: "Diagnosed from a live `zsh: segmentation fault` with no Python traceback (a SIGSEGV bypasses
      exception handling) while several follow-up batches' re-discovery + re-extraction ran concurrently.
      Root cause: `_acquire_batch_run` (issue #47) only serializes runs of the SAME batch_id, so
      autoflow's compose-followup could spawn Stage 4 for DIFFERENT batches on concurrent threads, all
      calling camelot.read_pdf at once. The project's own tool-roster spike
      (STAGE4_PROCESS_DESIGN.md, 2026-06-23) reported '0 crashes' across an 11-tool x 150-PDF
      SEQUENTIAL sweep — consistent with this only failing under concurrency that sweep never exercised.
      A max-effort review of the fix itself found and closed 5 further issues in the same pass: main()'s
      TypeError-safe exit-code interpretation, log-file naming, temp-file cleanup on every exit path,
      malformed-stdout-line tolerance, and test coverage for the signal-kill path specifically (not just
      the happy path) — see PR #609's review notes. See STAGE4_PROCESS_DESIGN.md's 2026-07-21 decision-log
      entry for the full mechanism."

  - id: REQ-164
    github_issue: "#615 (Stage-9 receipt + 8/9 status-twin gap, partial); #484 (datacontract schemas, complement); #616 (cache_ingest disk-decouple follow-up, DONE for stages 2/4); #617 (epic — the four remaining stages + retroactive 6-9 backfill)"
    description: "Every acquisition pipeline stage, on completing work for a district, leaves a
      per-district, ALWAYS datetime-stamped receipt in that district's data/raw/lea-website-captures/<dir>/
      and refreshes district_status.json in the SAME code path. gov_db is the sole authoritative working
      store; the capture-dir receipts + district_status.json are audit cross-checks and recovery sources,
      NEVER data-transmission vehicles read as input by an active-pipeline stage (governance §1; the
      commandment-#1 auditability north star made a pipeline-wide invariant)."
    type: constraint
    priority: must
    status: tested
    acceptance_criteria:
      - "Each stage writes its per-district receipt into lea-website-captures/<district_dir>/ via ONE shared crash-safe helper (common/receipts.py) — never a bespoke per-stage json.dump into the capture dir — MET for stages 5/6/7/8/9 (basenames stage5_filter/stage6_dispatch/stage7_extract/stage8_aggregate/stage9_incorporate); stages 2 (discover)/3 (capture)/4 (process) DEFERRED to #617/#622/#623 — their artifact's EXISTENCE is still a stage-done marker read by fixed name (discovery.json/candidates.json/captures.json/processed.json), so renaming them would break reconcile until the done-marker->gov_db inversion lands"
      - "Receipts are ALWAYS datetime-stamped, first run included (no fixed-'latest' name): filename = <basename>.<fs_stamp>.<writer>-<h8>.json, fs_stamp=YYYYMMDDTHHMMSSZ (timeutil.fs_stamp); writer ∈ {py,node} tags the producing language so per-writer hashes are self-evidently per-writer (loose-with-writer-tag, 2026-07-22 — cross-language hash agreement is neither required nor implied); h8 = first 8 hex of sha256 over the canonical payload MINUS volatile keys (any generated_at it carries), so a re-run never clobbers a prior receipt and a same-second same-content write is idempotent — MET. Basename convention UNIFIED 2026-07-23 (Ian): every basename is stage<N>_<stage_name> (the same stage_name state_event uses) so a filesystem/name sort groups a district's receipts in pipeline order; a benchmark-provenance receipt gets the basename suffixed _benchmark (invisible to the production resolver via the same '.'-anchored glob)"
      - "Chronological order is carried by the timestamp (lexically sortable filename); the finer ordering authority is state_event.event_id in gov_db, never the filename; the content hash is the same-second collision-breaker only — MET"
      - "The receipt write happens AFTER the gov_db state_event commit (commit-before-receipt): a crash may leave a LAGGING receipt (re-derivable) but never a receipt AHEAD of the authoritative DB — MET, all five writers"
      - "Any code path that writes a stage's state_event refreshes district_status.json in the same path (closes the gate@8 / Stage-9 gap where the twin lagged until an incidental later export) — MET (stages 6/7/8/9; Stage 5's release regen was already in-path)"
      - "No active-pipeline stage reads a per-district capture-dir receipt as its input (receipts are audit/recovery only); the last such edge — cache_ingest's disk re-read — is tracked as #616 — MET for the round-trip half (stage2/4 finish_district now projects the in-memory doc/list straight into gov_db, no reread); the remaining dir-based reads (Stage-3 Node->Python handoff, the Stage-2 self-heal backfill, benchmark inject, the Stage-5 build_signals regenerator) are the LEGITIMATE cross-process/no-in-memory-object cases #616's own note calls out to repoint, not eliminate — tracked under #622/#623"
      - "Each stage's receipt has a declared payload schema — the target of #484's datacontract.yaml validation — NOT MET, deferred to #484 (separate issue, unstarted)"
      - "Every stage's per-district receipt is declared in arch-manifest.json for all 9 stages; a both-ways fitness test fails if a stage lacks a declared per-district receipt OR a declared producer doesn't reference its artifact — MET for the 5 stamped-receipt stages (file_dispatches.audit_receipts + test_no_undeclared_audit_receipt/test_no_stale_audit_receipt_declaration/test_audit_receipt_producer_matches_bidirectionally, mirroring the external_programs bidirectional pattern); discovery.json/candidates.json/captures.json/processed.json stay declared in file_dispatches.receipts (fixed-filename form) until #622/#623 convert them, at which point they become audit_receipts too (\"all 9 stages\" fully met)"
      - "Legacy unstamped receipts are backfilled by renaming in place, timestamp sourced from the matching (district, stage) state_event.created_at (district_status.json equivalent fallback; file mtime last-resort for orphans, logged) — NEVER from filesystem create-date, which the pending external-drive migration resets — MET for Stage 5 (infrastructure/acquisition/maintenance/backfill_receipts.py, run live 2026-07-23: 112 legacy filtered.json backfilled to stage5_filter[_benchmark], 56 via state_event / 56 via mtime fallback, 0 remaining, idempotent on re-run); stages 2/3/4 join once #622/#623 convert their writers; retroactive generation of the ALREADY-missing stage 6-9 receipts (83/83/38/6 districts with no receipt, since those stages only write going-forward) approved by Ian 2026-07-23 and tracked as #624"
    tests:
      - tests/test_receipts.py
      - tests/test_backfill_receipts.py
      - tests/test_arch_manifest.py
    created: "2026-07-22T00:00:00Z"
    updated: "2026-07-23T00:00:00Z"
    notes: "Filed 2026-07-22 (Ian) as the COVERAGE/placement/stamping/logging side of receipts —
      complements #484 (shape validation) and subsumes the spec half of #615 (Stage-9 disk receipt +
      8/9 status refresh). Two parallel code-verified surveys established the pre-REQ-164 state: stages
      2-5 wrote per-district receipts (2/3/4 aside-stamped the prior copy on re-run, 5 overwrote in
      place); 6/7 wrote centralized hash-named receipts (handoffs/, extractions/) AND refreshed the twin;
      8/9 wrote state_event but no per-district disk receipt and did NOT refresh district_status.json
      in-path. ALWAYS-stamped chosen over fixed-latest+aside (Ian): humans sort by filename/date, and
      'receipts are audit-only, never transmission' removes the need for a stable 'latest' name.
      Sequenced new-receipts-first (Stage 9 -> 8 -> 7/6, pre-2026-07-22), then this session
      (2026-07-22/23, branch feat/pipeline-receipts-req164): Phase 5b (arch-manifest audit_receipts +
      bidirectional coverage tests) -> Phase 4 backfill script -> #616 round-trip elimination (stage2/4)
      -> Phase 3 (Stage 5 filtered->stage5_filter conversion; investigation showed processed.json's
      EXISTENCE is Stage 4's done-marker — same coupling as discovery.json — so it deferred alongside
      discovery/candidates/captures rather than converting per the original 3-stage plan) -> basename
      unification (stage<N>_<stage_name>) -> live backfill run. The wider design discussion this
      surfaced (why does benchmark injection mimic Stage 2/3 output at all; the district-keyed Stage-9
      wall doesn't clear even after an honest re-run) became epic #617 (8 sub-issues #618-625),
      cross-linked to Council Lab #80. STATUS tested: the shared helper, 5 of 9 stage writers, the
      bidirectional manifest coverage, the backfill script (run live), and #616's round-trip elimination
      are all built and tested; the remaining 4 writers + retroactive 6-9 generation + #484 schema
      validation are explicitly deferred (tracked, not silently dropped) per the MET/DEFERRED markers
      above — the same pattern REQ-117 uses for its own open items."

  # ---------------------------------------------------------------------------
  # THE FOUR COMMANDMENTS (2026-07-22, Ian) — the project's governing priorities
  # (MEMORY.md project-four-commandments) encoded into the ledger so they are
  # TESTABLE, not just cultural. A `type: principle` REQ is verified through its
  # `enforced_by` children (deterministic fitness/unit tests that cover SLICES of
  # the principle) plus, for the residual it cannot make deterministic, a periodic
  # LLM sweep (checkpoint skill + Haiku agents). `verification` ∈ {deterministic,
  # mixed, periodic-sweep}. "As automated as tolerable."
  # ---------------------------------------------------------------------------

  - id: REQ-165
    description: "COMMANDMENT #1 (NORTH STAR) — AUDITABILITY. Every material fact, decision, and state
      transition must be reconstructable after the fact from durable, inspectable records: what was decided,
      by which actor, from what evidence, under what code vintage. Provenance is DERIVED from receipts,
      never inferred from absence-of-evidence; the gov_db state_event log + the per-stage receipts are the
      audit substrate (governance §1)."
    type: principle
    priority: must
    status: accepted
    acceptance_criteria:
      - "A principle REQ is verified through its enforced_by children (deterministic) PLUS a periodic sweep for the residual — never a single suite"
      - "Every stage completion leaves a per-district receipt + a state_event row; provenance is derived from those receipts, never stamped-then-trusted or inferred from absence (REQ-164, REQ-128)"
      - "A human/automated determination freezes what was acted on with a fingerprint, so a later change is detectably stale under the SAME code vintage (REQ-147)"
      - "Cross-boundary couplings the import tools cannot see are declared + fitness-tested (arch-manifest.json / tests/test_arch_manifest.py)"
      - "The residual — is a NEW decision surface auditable? was a new environmental edge declared? — is caught by the periodic sweep, not a unit test"
    enforced_by: [REQ-164, REQ-147, REQ-128, REQ-054, REQ-087, "tests/test_arch_manifest.py"]
    verification: mixed
    created: "2026-07-22T00:00:00Z"
    updated: "2026-07-22T00:00:00Z"
    notes: "Ian's governing commandment #1 (MEMORY.md project-four-commandments). New `type: principle`
      schema (Ian-approved 2026-07-22): enforced_by = the child REQs/fitness tests that deterministically
      cover slices; verification=mixed flags the residual is caught by a periodic LLM sweep. Companions:
      REQ-166/167/168."

