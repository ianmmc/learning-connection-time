      - "A validation harness scores per-school + per-band output vs gt_curation gt_proposals.json (±15 min) for batch_00000 — MET: full-batch run scored 95.2% band / 99.3% per-school (text), 88.5%/98.1% (image), 24 districts / 83 reps"
