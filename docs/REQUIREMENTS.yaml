    created: "2026-06-26T00:00:00Z"
    updated: "2026-06-26T00:00:00Z"
    notes: "Designed (research-backed: CUSUM+Wilson beat EWMA/Page-Hinkley for binary-proportion metrics; KS/chi-sq
