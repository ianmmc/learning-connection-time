  - id: REQ-168
    description: "COMMANDMENT #4 — ONE HUMAN'S TIME. The pipeline is built HIGH-SUPERVISION-FIRST and eased
      toward auto only as each gate's reliability is proven ('as automated as tolerable'); human touchpoints
      are minimized and never required where an automatic action is safe — spend-conservative AND observable
      AND reversible. Largely qualitative: the primary verification is a periodic review, not a unit test."
