# State SEA data catalog — source of truth for the state-data campaign.
# STATE_DATA_AVAILABILITY_ASSESSMENT.md is regenerated from this file.
# Probe/acquisition agents append receipt records here; humans review diffs.
meta:
  version: '1'
  updated: '2026-07-20'
  purpose: >-
    Source of truth for the SEA data collection campaign: what each state education agency publishes,
    probe results, and acquisition receipts. STATE_DATA_AVAILABILITY_ASSESSMENT.md is REGENERATED from
    this file — edit here, not there.
  precedence_context: >-
    Verified against the live DB 2026-07-20: staff_counts_effective is 100% nces_ccd across all states
    and years — SEA staff/enrollment data wins REQ-023 precedence NOWHERE today, because year-matched
    NCES (2024-25 CCD, ingested 2026-07) beats year-matched SEA by design (REQ-022/023). SEA data currently
    pays off through: (1) SPED-actual data via REQ-025 (state-actual beats the 2017-18 federal estimate
    — CA contributes 2,036 LCT rows today), (2) SPED-teacher splits feeding SPED scopes, and (3) years
    NEWER than the NCES primary (2025-26+), where SEA wins until the next CCD lands. Probe priority
    follows this ranking. NOT a target: daily instructional minutes — verified dead end
    (docs/INSTRUCTIONAL_TIME_HARVEST.md).
  crosswalk_correction: >-
    CORRECTION (2026-07-20, post-probe, Ian caught this): the per-state `crosswalk_ids` probe results
    below were answering the wrong question. They report whether a STATE PORTAL publishes its own
    state-ID<->NCES-LEAID crosswalk file — most don't, which the probe agents correctly and honestly
    reported as `not-found`/`reported-partial` for most states. But REQ-027's crosswalk is NOT sourced
    from state portals at all: `state_district_crosswalk` (17,842 rows, id_system='st_leaid',
    source='nces_ccd') is already populated from the ST_LEAID column in NCES CCD's own LEA directory
    file (ccd_lea_052_*), which is 100% populated across all 3.8M rows / all 56 jurisdictions in the
    already-ingested 2024-25 file — verified directly. Spot-checked coverage for states the probes
    flagged crosswalk-not-found (CT 201 rows, GA 234, MO 564, NM 152, SC 94, MS 152, ND 170, ID 187,
    RI 64, MT 397): all already have real crosswalk rows in the DB. The per-state crosswalk_ids field
    below is kept for completeness (it may still matter if a state's own ID differs from what CCD
    records, or for cross-validation per REQ-021) but is NOT a blocking gap for acquisition — do not
    treat any state's crosswalk as unacquired just because its portal doesn't publish one.
  availability_vocab:
  - reported-yes
  - reported-partial
  - reported-no
  - unknown
  - confirmed
  - not-found
  - blocked
  flags_vocab:
  - refresh-candidate
  - blocked
  - follow-up-manual
  - login-required
  - api-available
  - dashboard-only
  - request-only
  seed_provenance: >-
    Seeded 2026-07-20 from the 2026-01-11 assessment matrix (availability values reported-*, unverified)
    plus DB-verified status for the 9 integrated states. reported-* values become confirmed / not-found
    / blocked only via probe receipts.
consolidated_sources:
- name: NCES CCD ST_LEAID (already in our own ingested data — the real crosswalk source)
  url: null
  probed: '2026-07-20'
  outcome: confirmed
  detail: >-
    The state-ID<->NCES-LEAID crosswalk this campaign was probing SEA portals for already exists,
    for free, in data we ingested months ago: ccd_lea_052_*.csv (the NCES CCD LEA directory file)
    carries an ST_LEAID column (e.g. "NE-120056000", "WI-3862") 100% populated across all 3.8M rows /
    56 jurisdictions in the 2024-25 file, paired 1:1 with the federal LEAID. `state_district_crosswalk`
    (REQ-027, 17,842 rows) is already sourced from exactly this field (source='nces_ccd',
    id_system='st_leaid'). See meta.crosswalk_correction for the full story — this superseded the
    per-state crosswalk_ids probing before it started; kept for the record so it isn't re-derived.
  urls:
  - data/raw/federal/nces-ccd/2024_25/ccd_lea_052_2425_l_1a_073025.csv
- name: IDEA Section 618 LEA Part B Child Count (data.ed.gov)
  url: https://data.ed.gov/dataset/16968dd3-87bd-4e4a-92ed-50f03e6c4941
  probed: '2026-07-20'
  outcome: confirmed
  detail: >-
    District(LEA)-level SPED child counts by disability category, ALL states in one federal CSV per year,
    direct download URLs, current through 2024-25 (bchildcountdisabilitycategorylea2024-25.csv). State-reported
    actuals — a candidate to supersede the 2017-18 SPED baseline nationally under REQ-025, likely higher-yield
    than most per-state SEA probes. Note: 2021-22-and-earlier files bundled educational environment; 2022-23+
    split it out — the LEA-level ed-environment companion dataset still needs locating.
  urls:
  - >-
    https://data.ed.gov/dataset/16968dd3-87bd-4e4a-92ed-50f03e6c4941/resource/00a5a1b6-835b-4f4e-9de6-bfb43f877087/download/bchildcountdisabilitycategorylea2024-25.csv
  - >-
    https://data.ed.gov/dataset/16968dd3-87bd-4e4a-92ed-50f03e6c4941/resource/5a208d37-564a-40c8-a91d-dd2874fed48c/download/bchildcountdisabilitycategorylea2023-24.csv
- name: CRDC (Civil Rights Data Collection), 2021-22 public-use files
  url: https://civilrightsdata.ed.gov/data
  probed: '2026-07-20'
  outcome: confirmed
  detail: >-
    2021-22 CRDC public-use data files released January 2025 — the newest usable collection (2020-21 exists
    but is a COVID-excluded year). Refresh candidate for the 2017-18 CRDC-based SPED baseline (REQ-018),
    4 years newer; VERIFY first that the 2021-22 elements include the staffing fields the baseline derivation
    used (SPED teachers / paraprofessionals). 2023-24 CRDC: submission closed 2025-04, release slipped
    from 'end of Dec 2025' to 'by 2026' (still N/A as of 2026-03 page review) — watch, do not wait.
  urls:
  - https://civilrightsdata.ed.gov/data
- name: Urban Institute Education Data Portal API
  url: https://educationdata.urban.org/api/v1/
  probed: '2026-07-20'
  outcome: confirmed
  detail: >-
    Clean REST API over CCD/CRDC/EDFacts. school-districts/ccd/directory returns state_leaid per district
    (verified 2023, e.g. NE-120056000) — useful to backfill/verify state_district_crosswalk (REQ-027)
    for every state without touching SEA portals, and as an independent validation source (REQ-021). Supplements,
    never substitutes for, SEA-actual data.
  urls:
  - https://educationdata.urban.org/api/v1/school-districts/ccd/directory/2023/
- name: CCSSO / AASA / NSBA / NAESP
  probed: '2026-07-20'
  outcome: not-found
  detail: >-
    Membership/policy organizations — publish aggregates and reports, not district-level FTE/enrollment/SPED
    files. Not acquisition sources.
