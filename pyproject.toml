[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-connection-time"
version = "0.1.0"
description = "Learning Connection Time — LCT equity metrics + the per-school instructional-time acquisition pipeline"
requires-python = ">=3.10"
# Dependencies are intentionally NOT declared here yet — they remain managed by requirements.txt
# (`pip install -r requirements.txt`). This file exists so `pip install -e .` makes the source tree
# importable as proper packages (`infrastructure.acquisition.*`), removing the sys.path.insert shims
# (REQ-098, see docs/technical-notes/PIPELINE_GOVERNANCE_AND_STATE_2026-06.md §9a). Folding deps into
# pyproject is a separate, later step.

# --- Architecture contracts (REQ-098 step 4): `lint-imports` enforces these in CI. ---
[tool.importlinter]
root_packages = ["infrastructure"]
include_external_packages = true   # needed to forbid the external `openai` SDK below (REQ-119, #148)

[[tool.importlinter.contracts]]
name = "Layering: process_governance (app) > stages (independent) > common (base)"
type = "layers"
layers = [
    "process_governance",
    "stage1_queue | stage2_discover | stage3_capture | stage4_process | stage5_filter | stage6_handoff | stage7_extract | stage8_aggregate",
    "common",
]
containers = ["infrastructure.acquisition"]

[[tool.importlinter.contracts]]
name = "Acquisition must not import the LCT database layer (except the sanctioned Stage 1 read / Stage 9 write — THE POINT of the pipeline)"
type = "forbidden"
source_modules = ["infrastructure.acquisition"]
forbidden_modules = ["infrastructure.database"]
# Stage 1 reads enrollment for the queue; Stage 9 (not built yet) will write minutes back.
ignore_imports = [
    "infrastructure.acquisition.stage1_queue.queue_batch -> infrastructure.database.connection",
    "infrastructure.acquisition.stage1_queue.queue_batch -> infrastructure.database.models",
]

[[tool.importlinter.contracts]]
name = "The LCT/database/scripts layer must not import the acquisition pipeline"
type = "forbidden"
source_modules = ["infrastructure.database", "infrastructure.scripts"]
forbidden_modules = ["infrastructure.acquisition"]

[[tool.importlinter.contracts]]
# REQ-119 (#148): forbid ANY OpenAI SDK import in acquisition outside the sanctioned streaming client.
# With include_external_packages=true, grimp graphs function-scoped imports too, so this catches both
# module-level and in-function SDK use — including the module-level case the AST source-guard test
# can't see (it walks function bodies only). The ignore below is therefore REQUIRED: openrouter's own
# function-scoped `import openai` IS in the graph and would break the contract without it.
name = "No OpenAI SDK import in acquisition outside openrouter — the one paid surface streams (REQ-119)"
type = "forbidden"
source_modules = ["infrastructure.acquisition"]
forbidden_modules = ["openai"]
ignore_imports = [
    # The ONE sanctioned SDK importer — the streaming client. Any OTHER acquisition module importing
    # openai breaks this contract (a second paid surface that skipped the streaming/billing-halt path).
    "infrastructure.acquisition.stage7_extract.openrouter -> openai",
]

[tool.setuptools.packages.find]
where = ["."]
# `infrastructure` is a PEP 420 namespace package (no top-level __init__.py); its source subpackages
# (acquisition.*, database, scripts, utilities) carry their own markers or resolve as namespaces.
include = ["infrastructure*"]
# The Node capture layer (infrastructure/scraper, incl. node_modules) is invoked via subprocess, never
# imported by Python — exclude it so find doesn't try to package thousands of node_modules dirs.
exclude = ["infrastructure.scraper*", "*node_modules*", "*__pycache__*"]
namespaces = true
