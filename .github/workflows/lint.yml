name: Lint

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR (base = a feature branch) must still get CI —
  # the #251 incident PR ran zero checks because this used to be `branches: [main]`.
  pull_request:
  # #722: nightly run so a red main is detected within 24h even with no pushes (see test.yml).
  schedule:
    - cron: '17 9 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Lint with flake8 (critical errors only)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: REQUIREMENTS.yaml must parse (issue #77)
        run: |
          # The requirements ledger was once broken YAML for an unknown period (fable review #7);
          # this guarantees a parse regression can never land silently again.
          python -c "
          import yaml
          d = yaml.safe_load(open('docs/REQUIREMENTS.yaml'))
          assert isinstance(d.get('requirements'), list) and d['requirements'], 'no requirements parsed'
          print(f\"REQUIREMENTS.yaml OK: {len(d['requirements'])} requirements\")
          "

      - name: Lint with flake8 (warnings - non-blocking)
        run: |
          # Report other issues but don't fail the build
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Architecture contracts + dead-code sweep (REQ-098). import-linter enforces the acquisition
  # layering / forbidden-import contracts the pre-push hook claims CI runs but never actually did.
  # infrastructure/ is a namespace package, so grimp builds the graph from PYTHONPATH alone — no
  # full-requirements install needed (import-linter pulls grimp).
  arch-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install architecture-lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "import-linter>=2.0" "vulture>=2.10"

      - name: Enforce import contracts (import-linter — blocking)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: lint-imports

      - name: Dead-code sweep (vulture — non-blocking, informational)
        continue-on-error: true
        run: vulture infrastructure/acquisition
