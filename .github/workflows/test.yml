name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs the DB-free test suite only. Integration tests (marked `integration`) require a Postgres
# DB built from migrations and are run locally, not in CI. The previous CI built the DB from the
# obsolete schema.sql (see docs/PROJECT_HISTORY.md Part 5 — stale) and failed; the non-integration
# suite needs no DB at all (480 passed / 0 failed with no database, 2026-06-22).
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB-free tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Integration tests (require a migrations-built Postgres) are excluded; run locally.
          pytest tests/ -v --tb=short -m "not integration"
