[pytest]
testpaths = tests
# Repo root on sys.path, declared — not inherited from the runner. Test modules import repo-root
# helpers as `from tests import benchmark_seed`; pytest 8 made that work implicitly under the bare
# `pytest` script, pytest 9 does not (python -m pytest still would, via CWD). Declaring it keeps
# the suite green under both invocations and future import-mode changes.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests needing a local external resource — a database connection (LCT or governance Postgres) or the local NCES CCD dataset — run locally; the LCT-DB/NCES ones are excluded from CI
    govdb: integration tests needing ONLY the isolated governance Postgres (self-bootstrap their schema) — run in CI against a Postgres service container (these are also marked `integration`)
    snapshot: marks snapshot tests
